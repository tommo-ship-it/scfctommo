  const pid = (opts && opts.playerId) || ui.playerId;
  const p = PLAYERS.find(function(x){ return x.id===pid; });
  const goals = data.idp[pid]||[];
  const coach = !!(opts && opts.coach);
  const set = idpIsSet(pid);
  const avg = idpAvg(pid);
  let html = "";
  if(!coach){
    html += '<div class="page-title"><div><h2>My IDP</h2><p>Individual Development Plan \u00b7 '+esc(fullName(p))+'</p></div><span class="badge">'+(set?avg+"% overall":"Not set yet")+"</span></div>" +
      '<p class="notice" style="margin-bottom:12px">Targets and actions start blank on every pillar \u2014 technical, tactical, physical and psychological. You and your coach fill them in together over the season. Progress starts once a target is agreed. Coach comments and term review dates stay attached to each section.</p>';
  }
  html += goals.map(function(g){
    const filled = idpHasTarget(g);
    const agreed = g.agreed && (filled || String(g.actions||"").trim());
    return '<article class="idp-card" data-gid="'+g.id+'"><div class="pillar">'+esc(g.pillar)+'</div><div class="inner">' +
      '<label class="fld"><span>Target</span><textarea name="idp-target" rows="2" placeholder="To be agreed with your coach">'+esc(g.target||"")+"</textarea></label>" +
      '<label class="fld" style="margin-top:8px"><span>Actions</span><textarea name="idp-actions" rows="2" placeholder="Training and habits you will work on together">'+esc(g.actions||"")+"</textarea></label>" +
      (agreed ? '<p class="idp-agreed">Agreed with coach on '+fmtDate(g.agreed)+"</p>" : "") +
      '<button type="button" class="btn btn-sm btn-navy" style="margin-top:10px" data-act="save-idp-goal" data-pid="'+pid+'" data-gid="'+g.id+'">Save target and actions</button>' +
      (filled
        ? '<div class="fld-label" style="margin-top:12px">Progress \u00b7 <span data-pval="'+g.id+'">'+(+g.progress||0)+'%</span></div>' +

function formatClock(seconds){
  seconds = Math.max(0, Math.round(seconds));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return m + ":" + String(s).padStart(2, "0");
}
function unitWindows(minutes){
  const total = Math.max(0, Number(minutes) || 0) * 60;
  const a = total / 3;
  const b = 2 * total / 3;
  return {
    def: { label: formatClock(0) + "\u2013" + formatClock(a), third: "First 1/3" },
    mid: { label: formatClock(a) + "\u2013" + formatClock(b), third: "Middle 2/3" },
    att: { label: formatClock(b) + "\u2013" + formatClock(total), third: "Final 3/3" }
  };
}
function unitKeyForPos(pos){
  if(!pos) return null;
  if(pos==="GK" || pos==="CB" || pos==="FB") return "def";
  if(pos==="6" || pos==="8") return "mid";
  if(pos==="10" || pos==="Winger" || pos==="9") return "att";
  return null;
}

function saveVideoLinkOverride(key, fields){

function pointVideo(key){
  const base = POSITION_VIDEO_LINKS[key] || { text:"", url:"", source:"", notes:"" };
  const all = loadVideoLinkOverrides();
  const over = Object.prototype.hasOwnProperty.call(all, key) ? all[key] : null;
  const url = over ? (over.url || "") : (base.url || "");
  const source = over ? (over.source || "") : (base.source || "");
  const notes = over ? (over.notes || "") : (base.notes || "");
  return { key:key, text:base.text || "", url:url, source:source, notes:notes };
}
function zoneNum(label){
  const m = String(label).match(/Zone\s*(\d)/i);
  return m ? m[1] : "0";
}
function safeHttpUrl(url){
  try{
    const u = new URL(String(url || "").trim());
    if(u.protocol === "http:" || u.protocol === "https:") return u.href;
  }catch(e){}
  return null;
}
function videoEmbed(url){
  const href = safeHttpUrl(url);
  if(!href) return { type:"none" };
  let u;
  try{ u = new URL(href); }catch(e){ return { type:"none" }; }
  const host = u.hostname.replace(/^www\./, "").toLowerCase();

  let yid = null;
  if(host === "youtu.be") yid = u.pathname.split("/").filter(Boolean)[0];
  else if(host === "youtube.com" || host === "m.youtube.com" || host === "youtube-nocookie.com"){
    if(u.searchParams.get("v")) yid = u.searchParams.get("v");
    else if(/^\/(embed|shorts|live)\//.test(u.pathname)) yid = u.pathname.split("/")[2];
  }
  if(yid){
    yid = yid.replace(/[^A-Za-z0-9_-]/g, "");
    if(yid) return { type:"iframe", src:"https://www.youtube-nocookie.com/embed/"+yid+"?rel=0", open:href, kind:"YouTube" };
  }

  if(host === "vimeo.com" || host === "player.vimeo.com"){
    const m = u.pathname.match(/(\d+)/);
    if(m) return { type:"iframe", src:"https://player.vimeo.com/video/"+m[1], open:href, kind:"Vimeo" };
  }

  if(host === "drive.google.com" || host === "docs.google.com"){
    const fid = (u.pathname.match(/\/file\/d\/([^/]+)/) || [])[1] || u.searchParams.get("id");
    if(fid) return { type:"iframe", src:"https://drive.google.com/file/d/"+encodeURIComponent(fid)+"/preview", open:href, kind:"Google Drive" };
  }

  // Veo does not offer a reliable public embed, so open in a new tab.
  if(host === "veo.co" || host.endsWith(".veo.co")){
    return { type:"link", open:href, kind:"Veo" };
  }

  if(/\.(mp4|webm|ogg)(\?|$)/i.test(u.pathname)) return { type:"video", src:href, open:href, kind:"Video" };

  return { type:"link", open:href, kind:"Link" };
}

}

function avpCounts(metrics){
  const m = metrics || {};
  const created = (+m.avpCrePass||0) + (+m.avpCreDribble||0);
  const received = (+m.avpRecBetween||0) + (+m.avpRecBehind||0);
  return { created:created, received:received, total:created+received };
}
function avpPer90(actions, minutes){
  minutes = +minutes || 0;
  if(!minutes) return null;
  return actions * 90 / minutes;
}
function fmtAvp(n){
  if(n==null || !isFinite(n)) return "\u2014";
  const r = Math.round(n * 10) / 10;
  return Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(1);
}
function benchMap(pos){ return AVP_BENCHMARKS.map[pos] || AVP_BENCHMARKS.map.CM; }
function benchBucket(pos){
  const mp = benchMap(pos);
  return AVP_BENCHMARKS.buckets[mp.bucket] || AVP_BENCHMARKS.buckets.CM;
}
function avpTier(rate, bucket){
  if(!bucket || bucket.measured === false) return { id:"na", label:"Not measured" };
  if(rate==null) return { id:"none", label:"No data" };
  if(rate >= bucket.pro) return { id:"pro", label:"Pro" };
  if(rate >= bucket.best) return { id:"best", label:"Best" };
  if(rate >= bucket.better) return { id:"better", label:"Better" };
  if(rate >= bucket.good) return { id:"good", label:"Good" };
  return { id:"below", label:"Below Good" };
}
function avpFromLogs(logs){
  let created=0, received=0, minutes=0;
  (logs||[]).forEach(function(l){
    const c = avpCounts(l.metrics);
    created += c.created;
    received += c.received;
    minutes += +l.minutes || 0;
  });
  const total = created + received;
  return {
    created:created, received:received, total:total, minutes:minutes,
    rate: avpPer90(total, minutes),
    createdRate: avpPer90(created, minutes),
    receivedRate: avpPer90(received, minutes)
  };
}
function playerAvpSeason(pid){ return avpFromLogs(logsOf(pid)); }
function playerAvpMatch(pid, mid){
  const l = logFor(pid, mid);
  return l ? avpFromLogs([l]) : avpFromLogs([]);
}
function teamAvpMatch(mid){
  const f = fixture(mid);
  const minutes = f ? +f.minutes || 0 : 0;
  let created=0, received=0, logged=0;
  PLAYERS.forEach(function(p){
    const l = logFor(p.id, mid);
    if(!l) return;
    logged++;
    const c = avpCounts(l.metrics);
    created += c.created;
    received += c.received;
  });
  const total = created + received;
  return {
    created:created, received:received, total:total, minutes:minutes, logged:logged,
    rate: avpPer90(total, minutes),
    createdRate: avpPer90(created, minutes),
    receivedRate: avpPer90(received, minutes)
  };
}

}

function renderAvpGauge(stats, opts){
  opts = opts || {};
  const pos = opts.pos;
  const team = !!opts.team;
  const compact = !!opts.compact;
  if(!team && !hasPos(pos)){
    const title0 = opts.title || "AVP per 90";
    return '<div class="avp-card na"><div class="card-head"><h3>'+esc(title0)+'</h3>'+renderBenchInfoBtn()+"</div>" +
      '<p class="hint">Position not set, so the position benchmark is not applied. Ask your coach to set a position to see the AVP/90 tier.</p>' +
      (stats && stats.rate!=null ? '<p class="hint">Rate from logged matches: <strong>'+fmtAvp(stats.rate)+"/90</strong>.</p>" : "") +
    "</div>";
  }
  const mp = team ? null : benchMap(pos);
  const bucket = team ? AVP_BENCHMARKS.team : benchBucket(pos);
  const measured = team ? true : !(mp && (mp.measured === false || bucket.measured === false));
  const title = opts.title || (team ? "Team AVP per 90" : "AVP per 90");
  const scope = opts.scope || "Season to date";
  const rate = stats.rate;
  const tier = measured ? avpTier(rate, bucket) : { id:"na", label:"Not measured" };

  if(!measured){
    return '<div class="avp-card na">' +
      '<div class="card-head"><h3>'+esc(title)+"</h3>"+renderBenchInfoBtn()+"</div>" +
      '<p class="hint">Goalkeeper AVP is not measured in the MLS / European studies, so no tier is shown for this position.</p>' +
    "</div>";
  }

  const cap = Math.max(bucket.pro * 1.15, rate || 0, bucket.good || 1);
  function pct(v){ return Math.max(0, Math.min(100, (v / cap) * 100)); }
  const segs = [
    { cls:"g-below", from:0, to:bucket.good },
    { cls:"g-good", from:bucket.good, to:bucket.better },
    { cls:"g-better", from:bucket.better, to:bucket.best },
    { cls:"g-best", from:bucket.best, to:bucket.pro },
    { cls:"g-pro", from:bucket.pro, to:cap }
  ];
  const track = '<div class="avp-track" role="img" aria-label="AVP per 90: '+fmtAvp(rate)+', '+esc(tier.label)+'">' +
    segs.map(function(s){ return '<span class="seg '+s.cls+'" style="width:'+(pct(s.to)-pct(s.from))+'%"></span>'; }).join("") +
    (rate!=null ? '<span class="avp-marker" style="left:'+pct(rate)+'%"></span>' : "") +
  "</div>" +
  '<div class="avp-legend">' +
    '<span><i class="g-good"></i>Good '+fmtAvp(bucket.good)+"</span>" +
    '<span><i class="g-better"></i>Better '+fmtAvp(bucket.better)+"</span>" +
    '<span><i class="g-best"></i>Best '+fmtAvp(bucket.best)+"</span>" +
    '<span><i class="g-pro"></i>Pro '+fmtAvp(bucket.pro)+"</span>" +
  "</div>";

  const splitTotal = Math.max(stats.total, 1);
  const split = '<div class="avp-split">' +
    '<div class="avp-split-labs"><span>Created '+fmtAvp(stats.createdRate)+'/90 <em>('+stats.created+')</em></span><span>Received '+fmtAvp(stats.receivedRate)+'/90 <em>('+stats.received+')</em></span></div>' +
    '<div class="avp-split-bar"><span class="cre" style="width:'+(stats.total? (stats.created/splitTotal*100):0)+'%"></span><span class="rec" style="width:'+(stats.total? (stats.received/splitTotal*100):0)+'%"></span></div>' +
  "</div>";

  const notes = [];
  if(mp && mp.placeholder) notes.push('<strong>'+esc(mp.placeholder)+'.</strong> '+esc(mp.blurb));
  else if(mp && mp.blurb) notes.push(esc(mp.blurb));
  if(mp && mp.altNote) notes.push(esc(mp.altNote));
  if(mp && mp.dm){
    notes.push(esc(AVP_BENCHMARKS.dmNote));
    if(stats.createdRate!=null && stats.createdRate >= AVP_BENCHMARKS.dmEliteCreate){
      notes.push("<strong>Create-side elite.</strong> "+fmtAvp(stats.createdRate)+" created AVP per 90 is at or above the 8+ mark called out for a #6.");
    }
  }
  if(team){
    notes.push(esc(AVP_BENCHMARKS.doubleCount));
    if(stats.official) notes.push("Team totals are from the official sheet ("+stats.created+" created, "+stats.received+" received). Individual player logs are unchanged.");
    else if(opts.logged!=null) notes.push("From "+opts.logged+" player log"+(opts.logged===1?"":"s")+" in this match. Goalkeeper AVP is not measured and counts as 0.");
  }
  if(!compact) notes.push('<span class="aspirational">'+esc(AVP_BENCHMARKS.aspirational)+"</span>");

  const headRight = renderTierBadge(tier, rate!=null ? fmtAvp(rate)+"/90" : null) + renderBenchInfoBtn();
  if(compact){
    return '<div class="avp-compact">' +
      '<div class="avp-compact-top"><div class="avp-rate">'+fmtAvp(rate)+'<small> /90</small></div>'+renderTierBadge(tier)+"</div>" +
      track + split +
    "</div>";
  }
  return '<div class="avp-card card">' +
    '<div class="card-head"><h3>'+esc(title)+'</h3><div class="avp-head-right">'+headRight+'</div></div>' +
    '<p class="hint" style="margin-top:-4px;margin-bottom:8px">'+esc(scope)+(team?"":" · "+esc(bucket.label)+" benchmark")+"</p>" +
    '<div class="avp-rate-lg">'+fmtAvp(rate)+'<small>AVP / 90</small></div>' +
    track + split +
    (notes.length ? '<div class="avp-notes">'+notes.map(function(n){ return "<p>"+n+"</p>"; }).join("")+"</div>" : "") +
  "</div>";
}

function renderBenchAbout(){
  const b = AVP_BENCHMARKS;

function matchTargets(pos){ return (pos && MATCH_TARGETS[pos]) || null; }

function emptyMetrics(form){
  return { avpCrePass:0, avpCreDribble:0, avpRecBetween:0, avpRecBehind:0, shots:[], tgt:{}, tgtAttNote:"", tgtDefNote:"" };
}
function normalizeMetrics(m){
  const base = emptyMetrics();
  m = m || {};
  const tgt = {};
  if(m.tgt && typeof m.tgt==="object"){
    Object.keys(m.tgt).forEach(function(k){ tgt[k] = +m.tgt[k]||0; });
  }
  Object.keys(m).forEach(function(k){
    if(k.indexOf("tgt-")===0) tgt[k.slice(4)] = +m[k]||0;
  });
  return {
    avpCrePass:+m.avpCrePass||0,
    avpCreDribble:+m.avpCreDribble||0,
    avpRecBetween:+m.avpRecBetween||0,
    avpRecBehind:+m.avpRecBehind||0,
    shots: Array.isArray(m.shots) ? m.shots.slice() : [],
    tgt: tgt,
    tgtAttNote: m.tgtAttNote || "",
    tgtDefNote: m.tgtDefNote || ""
  };
}
function draftToMetrics(form, d){ return normalizeMetrics(d); }

function evalTarget(spec, counts){
  counts = counts || {};
  const vals = spec.actions.map(function(a){ return +counts[a.key]||0; });
  const sum = vals.reduce(function(s,v){ return s+v; }, 0);
  const hit = vals.some(function(v){ return v >= spec.target; }) || sum >= spec.target;
  return { hit:hit, sum:sum, vals:vals, target:spec.target };
}
function evalLogTargets(pos, metrics){
  const spec = matchTargets(pos);
  if(!spec) return { att:{ hit:false, sum:0, vals:[], target:0 }, def:{ hit:false, sum:0, vals:[], target:0 }, unset:true };
  const c = (metrics && metrics.tgt) || {};
  return { att: evalTarget(spec.attacking, c), def: evalTarget(spec.defensive, c) };
}
function seasonTargetHits(pid){
  const p = PLAYERS.find(function(x){ return x.id===pid; });
  const logs = logsOf(pid);
  let att=0, def=0, n=0;
  logs.forEach(function(l){
    const pos = logPosOf(l, p);
    if(!pos || !matchTargets(pos)) return;
    n++;
    const ev = evalLogTargets(pos, l.metrics);
    if(ev.att.hit) att++;
    if(ev.def.hit) def++;
  });
  return { att:att, def:def, n:n };
}
function hitPhrase(hits, n){
  if(!n) return "No matches logged";
  return "Hit in "+hits+" of "+n+" match"+(n===1?"":"es");
}

function renderTargetState(ev){
  return ev.hit
    ? '<span class="tgt-hit">Hit</span> <span class="tgt-frac">'+ev.sum+" / "+ev.target+"</span>"
    : '<span class="tgt-wait">Not yet</span> <span class="tgt-frac">'+ev.sum+" / "+ev.target+"</span>";
}

function renderTargetCard(pos, side, metrics, opts){
  opts = opts || {};
  const pack = matchTargets(pos);
  if(!pack) return "";
  const spec = pack[side];
  if(!spec) return "";
  const counts = (metrics && metrics.tgt) || {};
  const ev = evalTarget(spec, counts);
  const kind = side==="attacking" ? "Attacking" : "Defensive";
  const orNote = spec.actions.length>1
    ? '<p class="hint">Hit when the combined total, or either action alone, reaches '+spec.target+".</p>"
    : "";
  let body = "";
  if(opts.counters){
    body = spec.actions.map(function(a){
      return '<label class="fld"><span>'+esc(a.label)+"</span>"+stepper("tgt-"+a.key, counts[a.key]||0, 0, 30)+"</label>";
    }).join("") + orNote +
      '<label class="fld"><span>Note (optional)</span><textarea name="'+(side==="attacking"?"tgtAttNote":"tgtDefNote")+'" rows="2" placeholder="Optional short note on this target">'+esc((metrics && (side==="attacking"?metrics.tgtAttNote:metrics.tgtDefNote))||"")+"</textarea></label>";
  }else{
    const parts = spec.actions.map(function(a,i){
      return esc(a.label)+" "+(ev.vals[i]||0);
    });
    body = (spec.actions.length>1 ? '<p class="tgt-breakdown">'+parts.join(" · ")+" · combined "+ev.sum+"</p>" : "") +

    '<div class="target-top"><div class="kind">'+kind+' target</div><div class="target-state">'+renderTargetState(ev)+'</div></div>' +
    '<div class="goal-text">'+esc(spec.label)+"</div>" +

}

function player(){ return PLAYERS.find(function(p){ return p.id === ui.playerId; }) || PLAYERS.find(function(p){ return p.id==="avery"; }) || PLAYERS[0]; }
function teamById(id){ return TEAMS.find(function(t){ return t.id===id; }); }
function playersOf(teamId){

}

function fixturesOf(teamId){
  const id = teamId || currentTeamId();
  if(!id) return data.fixtures.slice();
  return data.fixtures.filter(function(f){ return f.teamId===id; });
}
function playedFixtures(teamId){ return fixturesOf(teamId).filter(function(f){ return f.status==="played"; }); }
function upcomingFixtures(teamId){ return fixturesOf(teamId).filter(function(f){ return f.status==="upcoming"; }); }
function latestPlayed(teamId){
  return playedFixtures(teamId).slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; })[0] || null;
}
function todayISO(){
  const d = new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function addDays(iso, n){
  const d = new Date(iso+"T12:00:00");
  d.setDate(d.getDate()+n);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function logStatus(pid, mid){
  if(logFor(pid, mid)) return "logged";
  const f = fixture(mid);
  if(!f) return "notlogged";
  return todayISO() > addDays(f.date, 3) ? "late" : "notlogged";
}
function statusLabel(st){
  return st==="logged" ? "Logged" : st==="late" ? "Late" : "Not logged";
}
function unitDone(mid, key){
  const rec = ((data.possessions[mid]||{})[key]) || {};
  return ((+rec.secured||0) > 0) || ((+rec.unsecured||0) > 0);
}
function teamTaskStatus(mid){
  return { def: unitDone(mid,"def"), mid: unitDone(mid,"mid"), att: unitDone(mid,"att") };
}
function idpReviewState(pid){
  const today = todayISO();
  const horizon = addDays(today, 14);
  let due=false, overdue=false, last=null;
  (data.idp[pid]||[]).forEach(function(g){
    if(g.agreed && (!last || g.agreed>last)) last=g.agreed;
    (g.comments||[]).forEach(function(c){ if(c.date && (!last || c.date>last)) last=c.date; });
    (g.reviews||[]).forEach(function(r){
      if(r.done){ if(r.date && (!last || r.date>last)) last=r.date; return; }
      if(!r.date) return;
      if(today > r.date) overdue=true;
      else if(r.date <= horizon) due=true;
    });
  });
  return { due:due && !overdue, overdue:overdue, last:last };
}
function teamIdpCounts(teamId){
  let due=0, overdue=0, set=0;
  const roster = playersOf(teamId);
  roster.forEach(function(p){
    const s = idpReviewState(p.id);
    if(s.overdue) overdue++;
    else if(s.due) due++;
    if(idpIsSet(p.id)) set++;
  });
  return { due:due, overdue:overdue, set:set, total:roster.length };
}
function matchTargetHits(teamId, mid){
  let att=0, def=0, n=0;
  playersOf(teamId).forEach(function(p){
    const l = logFor(p.id, mid);
    if(!l) return;
    const pos = logPosOf(l, p);
    if(!pos || !matchTargets(pos)) return;
    n++;
    const ev = evalLogTargets(pos, l.metrics);
    if(ev.att.hit) att++;
    if(ev.def.hit) def++;
  });
  return { att:att, def:def, n:n };
}
function teamAvpMatch(mid){
  const f = fixture(mid);
  const minutes = f ? +f.minutes || 0 : 0;
  const roster = f && f.teamId ? playersOf(f.teamId) : PLAYERS;
  let created=0, received=0, logged=0;
  roster.forEach(function(p){
    const l = logFor(p.id, mid);
    if(!l) return;
    logged++;
    const c = avpCounts(l.metrics);
    created += c.created;
    received += c.received;
  });
  const total = created + received;
  return {
    created:created, received:received, total:total, minutes:minutes, logged:logged,
    rate: avpPer90(total, minutes),
    createdRate: avpPer90(created, minutes),
    receivedRate: avpPer90(received, minutes)
  };
}
function unitRosterLabel(teamId, key){
  const titles = { def:"Goalkeeper, Center Back, Fullback", mid:"Number 6 and Number 8", att:"Number 10, Winger, Number 9" };
  const unit = key==="def"?"defence":key==="mid"?"midfield":"attack";

function resolvePossMatch(teamId){

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly","");
    ta.style.position="fixed";
    ta.style.left="-9999px";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy") ? resolve() : reject(new Error("copy failed")); }
    catch(e){ reject(e); }
    document.body.removeChild(ta);
  });
}

  if(typeof TEAM_AVP_SHEET !== "undefined" && TEAM_AVP_SHEET[mid]){
    const s = TEAM_AVP_SHEET[mid];
    if(s.created!=null && s.received!=null) return { created:+s.created||0, received:+s.received||0 };
  }
  const seed = ((typeof TEAMSNAP!=="undefined" && TEAMSNAP.fixtures) || (typeof FIXTURES!=="undefined" && FIXTURES) || []).find(function(x){ return x.id===mid; });
  const f = fixture(mid) || seed;
  if(f && f.avpCreated!=null && f.avpReceived!=null){
    return { created:+f.avpCreated||0, received:+f.avpReceived||0 };
  }
  return null;
}
function teamAvpMatch(mid){
  const f = fixture(mid);
  const minutes = f ? +f.minutes || 0 : 0;
  const roster = f && f.teamId ? playersOf(f.teamId) : PLAYERS;
  let created=0, received=0, logged=0;
  roster.forEach(function(p){
    const l = logFor(p.id, mid);
    if(!l) return;
    logged++;
    const c = avpCounts(l.metrics);
    created += c.created;
    received += c.received;
  });
  const sheet = teamAvpSheet(mid);
  if(sheet){
    created = sheet.created;
    received = sheet.received;
  }
  const total = created + received;
  return {
    created:created, received:received, total:total, minutes:minutes, logged:logged,
    official: !!sheet,
    rate: avpPer90(total, minutes),
    createdRate: avpPer90(created, minutes),
    receivedRate: avpPer90(received, minutes)
  };
}

function xgCalibrated(){
  return XG_ZONES.every(function(z){
    const v = XG_CONVERSIONS[z];
    return v!=null && isFinite(+v);
  });
}
function teamShotsLogged(mid){
  const f = fixture(mid);
  const roster = f && f.teamId ? playersOf(f.teamId) : PLAYERS;
  const shots = [];
  roster.forEach(function(p){
    const l = logFor(p.id, mid);
    ((l && l.metrics && l.metrics.shots) || []).forEach(function(s){ shots.push(s); });
  });
  return shots;
}
function matchXg(mid){
  if(!xgCalibrated()) return null;
  const row = entryXgSum(matchShots(mid, "us"));
  return row || { xg:0, n:0 };
}
function attackingMetrics(mid){
  const f = fixture(mid);
  const t = possTotals(mid);
  const mins = f ? +f.minutes||0 : 0;
  const shots = f ? +f.shots||0 : 0;
  const secured = effectiveSecured(mid);
  const avp = teamAvpMatch(mid);
  const shotFlowVal = mins ? (secured * shots / mins) : null;
  const possPerShot = shots ? (secured / shots) : null;
  const avpPerShot = shots ? (avp.received / shots) : null;
  const calibrated = xgCalibrated();
  const xgRow = calibrated ? matchXg(mid) : null;
  const xg = xgRow ? xgRow.xg : null;
  const attFlow = (calibrated && mins) ? (secured * (xg||0) / mins) : null;
  const possPerXg = (calibrated && xg && xg>0) ? (secured / xg) : null;
  return {
    mid: mid,
    secured: secured,
    shots: shots,
    mins: mins,
    shotFlow: shotFlowVal,
    possPerShot: possPerShot,
    avpTotal: avp.total,
    avpCreated: avp.created,
    avpReceived: avp.received,
    avpPerShot: avpPerShot,
    avpOfficial: !!avp.official,
    calibrated: calibrated,
    xg: xg,
    xgLogged: xgRow ? xgRow.n : 0,
    attFlow: (calibrated && mins) ? attFlow : null,
    possPerXg: possPerXg
  };
}
function seasonAttacking(teamId){
  const matches = playedFixtures(teamId).slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  const rows = matches.map(function(f){ return attackingMetrics(f.id); });
  function avg(key){
    const xs = rows.map(function(r){ return r[key]; }).filter(function(v){ return v!=null && isFinite(v); });
    if(!xs.length) return null;
    return xs.reduce(function(a,b){ return a+b; },0)/xs.length;
  }
  return {
    n: rows.length,
    rows: rows,
    latest: rows.length ? rows[rows.length-1] : null,
    prev: rows.length>1 ? rows[rows.length-2] : null,
    avgShotFlow: avg("shotFlow"),
    avgPossPerShot: avg("possPerShot"),
    avgAvpPerShot: avg("avpPerShot"),
    avgAttFlow: avg("attFlow"),
    avgPossPerXg: avg("possPerXg")
  };
}
function attTrend(current, previous, lowerIsBetter){
  if(current==null || previous==null || !isFinite(current) || !isFinite(previous)) return null;
  const diff = current - previous;
  if(Math.abs(diff) < 1e-9) return { dir:"flat", good:null, diff:0 };
  const up = diff > 0;
  return { dir: up?"up":"down", good: lowerIsBetter ? !up : up, diff:diff };
}
function fmtFlow(n){
  if(n==null || !isFinite(n)) return "\u2014";
  return n.toFixed(2);
}
function fmtRatio(n){
  if(n==null || !isFinite(n)) return "\u2014";
  const r = Math.round(n * 10) / 10;
  return Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(1);
}
function renderTrend(tr){
  if(!tr) return "";
  const arrow = tr.dir==="up" ? "\u2191" : tr.dir==="down" ? "\u2193" : "\u2192";
  const cls = tr.dir==="flat" ? "flat" : (tr.good ? "good" : "bad");
  return '<span class="att-trend '+cls+'">'+arrow+" vs last</span>";
}
function renderAttValue(opts){
  const wait = !!opts.wait;
  const empty = opts.empty;
  const value = opts.value;
  const fmt = opts.fmt || fmtFlow;
  if(wait) return '<div class="num wait">Waiting on xG calibration</div>';
  if(empty) return '<div class="num empty">No shots</div>';
  return '<div class="num">'+fmt(value)+"</div>";
}
function renderAttackingMetrics(mid, opts){
  opts = opts || {};
  const m = attackingMetrics(mid);
  const f = fixture(mid);
  const season = opts.season && opts.teamId ? seasonAttacking(opts.teamId) : null;
  const prev = season && season.rows ? (function(){
    const i = season.rows.findIndex(function(r){ return r.mid===mid; });
    return i>0 ? season.rows[i-1] : null;
  })() : (season && season.prev && season.latest && season.latest.mid===mid ? season.prev : null);
  const noShots = !m.shots;
  const tiles = [
    { key:"shotFlow", name:"Shot Flow", dir:"Higher is better", value:m.shotFlow, fmt:fmtFlow, lower:false, wait:false, empty:false, formula:m.secured+" \u00d7 "+m.shots+" \u00f7 "+m.mins },
    { key:"possPerShot", name:"Possessions per Shot", dir:"Lower is better", value:m.possPerShot, fmt:fmtRatio, lower:true, wait:false, empty:noShots, formula: noShots?"":m.secured+" \u00f7 "+m.shots },
    { key:"avpPerShot", name:"AVPs per Shot", dir:"Received AVPs only \u00b7 lower is generally better", value:m.avpPerShot, fmt:fmtRatio, lower:true, wait:false, empty:noShots, formula: noShots?"":m.avpReceived+" \u00f7 "+m.shots },
    { key:"attFlow", name:"Attacking Flow", dir:"Higher is better", value:m.attFlow, fmt:fmtFlow, lower:false, wait:!m.calibrated, empty:false },
    { key:"possPerXg", name:"Possessions per xG", dir:"Lower is better", value:m.possPerXg, fmt:fmtRatio, lower:true, wait:!m.calibrated, empty:m.calibrated && !(m.xg>0) }
  ];
  return '<div class="card att-panel" style="margin-top:12px"><div class="card-head"><h3>Attacking metrics</h3><span class="badge">Sample</span></div>' +
    '<div class="att-grid">' +
      tiles.map(function(tile){
        const tr = prev ? attTrend(tile.wait||tile.empty ? null : tile.value, tile.wait?null:prev[tile.key], tile.lower) : null;
        return '<div class="att-metric'+(tile.wait?" wait":"")+'"><div class="att-top"><div class="lbl">'+esc(tile.name)+"</div>"+renderTrend(tr)+"</div>" +
          renderAttValue(tile) +
          '<div class="dir">'+esc(tile.dir)+"</div>" +
          (tile.formula ? '<div class="att-formula">'+esc(tile.formula)+"</div>" : "") +
        "</div>";
      }).join("") +
    "</div>" +
    '<p class="att-explainer">Shot Flow rewards having lots of secured possessions, while Possessions per Shot shows how efficiently they are turned into attempts. Keep both for a balanced picture of attacking performance. Attacking Flow (secured possessions \u00d7 xG \u00f7 minutes) and Possessions per xG will appear once the six-zone xG model has been calibrated from collected shots.</p>' +
    '<p class="hint" style="margin-top:8px">AVPs per Shot = RECEIVED AVPs only (Received\u2013Between + Received\u2013Behind) \u00f7 shots. Created AVPs are not included in this ratio' +
      (noShots ? "." : " \u00b7 "+m.avpReceived+" received \u00f7 "+m.shots+" shot"+(m.shots===1?"":"s")+".") +
      (m.avpOfficial ? " Team totals for this match come from the official sheet ("+m.avpCreated+" created, "+m.avpReceived+" received)." : "") +
      (m.calibrated ? " xG is the sum of the calibrated zone values of our shots in Shot entry." : "") +
    "</p></div>";
}

  const rows = [

function openLog(matchId){
  const p = player();
  const existing = matchId ? logFor(p.id, matchId) : null;
  const fx = matchId ? fixture(matchId) : null;
  const m = existing ? normalizeMetrics(existing.metrics) : emptyMetrics();
  const stored = existing && existing.pos;
  ui.logMode = matchId || "new";
  ui.draft = Object.assign({
    matchId: matchId || "",
    minutes: existing ? existing.minutes : (fx? fx.minutes : 70),
    dominant: existing ? existing.dominant : 0,
    assertive: existing ? existing.assertive : 0,
    connected: existing ? existing.connected : 0,
    reflection: existing ? existing.reflection : "",
    veo: existing ? existing.veo : "",
    pos: stored || posCode(p) || "",
    shots: m.shots.slice(),
    tgt: Object.assign({}, m.tgt),
    tgtAttNote: m.tgtAttNote,
    tgtDefNote: m.tgtDefNote,
    _zone: null,
    _outcome: null,
    _goalType: null
  }, m);
  render();
}

function saveLog(){
  syncDraftFromDom();
  const p = player();
  const d = ui.draft;
  if(!d.matchId){ toast("Select a match"); return; }
  if(!d.minutes){ toast("Enter minutes played"); return; }
  const existing = logFor(p.id, d.matchId);
  const posToStore = (existing && existing.pos) ? existing.pos : (d.pos || posCode(p) || "");
  const form = hasPos(posToStore) ? POS[posToStore].form : "";
  const metrics = draftToMetrics(form, d);
  const entry = {
    matchId:d.matchId, minutes:+d.minutes||0,
    dominant:+d.dominant||0, assertive:+d.assertive||0, connected:+d.connected||0,
    reflection:d.reflection||"", veo:d.veo||"", pos: posToStore, metrics: metrics
  };
  const list = data.logs[p.id] || (data.logs[p.id]=[]);
  const i = list.findIndex(function(l){ return l.matchId===d.matchId; });
  if(i>=0) list[i]=entry; else list.push(entry);
  saveData();
  ui.logMode=null; ui.draft=null;
  toast("Match log saved");
  render();
}

    '<div class="card" style="margin-top:14px"><h3>The metrics we will record</h3>' +
      '<p class="hint" style="margin-bottom:10px">VEO = camera data | PLAYER = manually coded from video | MODEL = calculated by coach/model | Counts reviewed per 90</p>' +
      '<div style="overflow-x:auto"><table class="metrics-table"><thead><tr><th>Measure</th><th>Source</th><th>What it tells us</th></tr></thead><tbody>' +
        pr.metrics.map(function(row){ return "<tr><td><strong>"+esc(row[0])+"</strong></td><td>"+srcPill(row[1])+"</td><td>"+esc(row[2])+"</td></tr>"; }).join("") +
      "</tbody></table></div>" +
      '<p class="notice" style="margin-top:12px">In this prototype the match log records the two match targets, AVP counts for every position'+(pr.shots?", and optional shot location and outcome":"")+", plus the shared reflection and Dominant / Assertive / Connected ratings. The table above is the club measurement list from the profile.</p>" +
    "</div>" +
    (ui.role==="coach"
      ? '<p class="notice" style="margin-top:12px">Coach view of '+esc(pr.title)+". Use the tabs to move between positions and open a point to paste its video link.</p>"
      : (hasPos(p) && tab===p.pos
        ? '<p class="notice" style="margin-top:12px">This is '+esc(p.first)+"'s stored position, set by the coach, so these are the targets and the match-log form she sees.</p>"
        : (hasPos(p)
          ? '<p class="notice" style="margin-top:12px">Previewing '+esc(pr.title)+". Your assigned position is "+esc(posAssignLabel(p.pos))+".</p>"
          : "")));
}


function bind(){
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", function(ev){
    if(ev.key==="Escape"){ if(ui.shotDraft){ ui.shotDraft=null; render(); return; } ui.switcher=false; ui.more=false; ui.vid=null; ui.pointVid=null; ui.benchInfo=false; render(); }
  });
}

function onClick(ev){
  const t = ev.target.closest("[data-act], [data-zone], [data-entry-zone], .sheet-backdrop, .vid-modal, .rate button, .stepper button");
  if(!t){
    if(ui.switcher && !ev.target.closest(".player-switch")){ ui.switcher=false; render(); }
    return;
  }
  const act = t.getAttribute("data-act");

  if(handleShotEntryClick(t, ev)) return;
  if(handleTeamPanelClick(t, ev)) return;

  if(t.classList.contains("sheet-backdrop")){ ui.more=false; render(); return; }
  if(act==="close-vid" || act==="close-point-vid" || act==="close-bench-info"){
    if(t.classList.contains("vid-modal") && ev.target.closest(".box")) return;
    ui.vid=null; ui.pointVid=null; ui.benchInfo=false; render(); return;
  }
  if(act==="toggle-bench-info"){ ui.benchInfo=!ui.benchInfo; render(); return; }

  if(t.matches(".stepper button")){
    const wrap = t.closest(".stepper");
    const inp = wrap.querySelector("input");
    const min = inp.min===""?0:+inp.min, max = inp.max===""?99:+inp.max;
    let v = +inp.value||0;
    v = t.getAttribute("data-act")==="inc" ? Math.min(max,v+1) : Math.max(min,v-1);
    inp.value = v;
    if(ui.draft){ ui.draft[inp.name]=v; }
    if(wrap.closest(".target-card")) refreshTargetCards();
    return;
  }

  if(t.matches(".rate button")){
    const name = t.parentElement.getAttribute("data-rate");
    const val = +t.getAttribute("data-val");
    if(ui.draft) ui.draft[name]=val;
    t.parentElement.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", +b.getAttribute("data-val")===val); });
    return;
  }

  if(t.hasAttribute("data-zone")){
    ev.preventDefault();
    const zone = t.getAttribute("data-zone");
    if(document.querySelector("[data-saves-pitch]")){
      syncDraftFromDom();
      ui.draft.saves = ui.draft.saves || emptyMetrics("gk").saves;
      ui.draft.saves[zone] = (ui.draft.saves[zone]||0)+1;
      render();
      toast("Save added in "+zone);
      return;
    }
    if(document.querySelector("[data-shot-pitch]")){
      syncDraftFromDom();
      ui.draft._zone = zone;
      maybeAddShot();
      render();
      return;
    }
  }

  if(act==="login-player"){ ui.role="player"; ui.page="dashboard"; ui.playerId="avery"; render(); window.scrollTo(0,0); return; }
  if(act==="login-coach"){ ui.role="coach"; ui.page="squad"; ui.coachPlayerId=null; ui.coachTeamId=null; ui.coachAssign=false; render(); window.scrollTo(0,0); return; }
  if(act==="logout"){ ui.role=null; ui.more=false; ui.switcher=false; ui.logMode=null; render(); return; }
  if(act==="toggle-switcher"){ ui.switcher=!ui.switcher; render(); return; }
  if(act==="switch-player"){
    ui.playerId = t.getAttribute("data-id");
    ui.switcher=false; ui.logMode=null; ui.draft=null; ui.posTab=player().pos;
    toast("Viewing "+fullName(player())+" \u00b7 "+(hasPos(player())?posLabel(player()):"Position not set"));
    render(); return;
  }
  if(act==="nav"){
    const page = t.getAttribute("data-page");
    if(page==="more"){ ui.more=true; render(); return; }
    ui.page=page; ui.more=false; ui.switcher=false; ui.logMode=null; ui.draft=null;
    if(page!=="summary"){ ui.shotMatch=null; ui.shotDraft=null; ui.teamPanelMatch=null; }
    if(page==="squad"){ ui.coachPlayerId=null; ui.coachTeamId=null; }
    render(); window.scrollTo(0,0); return;
  }
  if(act==="close-more"){ ui.more=false; render(); return; }
  if(act==="reset"){
    data = buildSeed(); applyPositions(); saveData(); ui.more=false; ui.logMode=null; ui.draft=null; ui.shotMatch=null; ui.shotDraft=null; ui.teamPanelMatch=null;
    toast("Sample data restored"); render(); return;
  }
  if(act==="new-log"){ openLog(null); window.scrollTo(0,0); return; }
  if(act==="open-log"){ openLog(t.getAttribute("data-id")); window.scrollTo(0,0); return; }
  if(act==="close-log"){ ui.logMode=null; ui.draft=null; render(); window.scrollTo(0,0); return; }
  if(act==="shot-outcome"){
    syncDraftFromDom();
    ui.draft._outcome = t.getAttribute("data-val");
    maybeAddShot();
    render(); return;
  }
  if(act==="del-shot"){
    syncDraftFromDom();
    const i = +t.getAttribute("data-i");
    (ui.draft.shots||[]).splice(i,1);
    render(); return;
  }
  if(act==="save-log"){ saveLog(); return; }
  if(act==="pos-tab"){ ui.posTab=t.getAttribute("data-id"); render(); return; }
  if(act==="open-vid"){ ui.vid=t.getAttribute("data-id"); render(); return; }
  if(act==="close-vid"){ ui.vid=null; render(); return; }
  if(act==="open-point-vid"){ ui.pointVid=t.getAttribute("data-key"); render(); return; }
  if(act==="save-point-vid"){
    const key = t.getAttribute("data-key") || ui.pointVid;
    const box = document.querySelector(".point-vid-box");
    const urlEl = box && box.querySelector('[name="point-url"]');
    const srcEl = box && box.querySelector('[name="point-source"]');
    const notesEl = box && box.querySelector('[name="point-notes"]');
    saveVideoLinkOverride(key, {
      url: urlEl ? urlEl.value : "",
      source: srcEl ? srcEl.value : "",
      notes: notesEl ? notesEl.value : ""
    });
    toast("Video link saved");
    render();
    return;
  }
  if(act==="save-unit"){ saveUnit(t.getAttribute("data-mid"), t.getAttribute("data-unit")); return; }
  if(act==="open-team"){
    ui.coachTeamId = t.getAttribute("data-id");
    ui.coachPlayerId = null;
    ui.page = "squad";
    ui.coachFilter = "all";
    ui.coachPos = "all";
    ui.coachSort = "status";
    const latest = latestPlayed(ui.coachTeamId);
    ui.coachMatch = latest ? latest.id : null;
    ui.possMatch = ui.coachMatch || ui.possMatch;
    render(); window.scrollTo(0,0); return;
  }
  if(act==="back-to-teams"){ ui.coachTeamId=null; ui.coachPlayerId=null; ui.coachAssign=false; ui.page="squad"; render(); window.scrollTo(0,0); return; }
  if(act==="back-to-team"){
    const p = PLAYERS.find(function(x){ return x.id===ui.coachPlayerId; });
    if(p) ui.coachTeamId = p.teamId;
    ui.coachPlayerId=null; ui.page="squad"; render(); window.scrollTo(0,0); return;
  }
  if(act==="toggle-assign"){ ui.coachAssign=!ui.coachAssign; render(); window.scrollTo(0,0); return; }
  if(act==="coach-filter"){ ui.coachFilter=t.getAttribute("data-val")||"all"; render(); return; }
  if(act==="copy-reminder"){
    const tid = ui.coachTeamId || coachScopeTeamId();
    const mid = resolveCoachMatch(tid);
    const names = reminderNames(tid, mid);
    if(!names.length){ toast("Everyone has logged this match"); return; }
    copyText(names.join("\n")).then(function(){ toast("Copied "+names.length+" name"+(names.length===1?"":"s")+" — nothing was sent"); }).catch(function(){ toast("Could not copy"); });
    return;
  }
  if(act==="open-player"){ ui.coachPlayerId=t.getAttribute("data-id"); ui.page="squad"; render(); window.scrollTo(0,0); return; }
  if(act==="save-idp-goal"){
    const pid=t.getAttribute("data-pid"), gid=t.getAttribute("data-gid");
    const card = t.closest(".idp-card") || document.querySelector('.idp-card[data-gid="'+gid+'"]');
    const targetEl = card && card.querySelector('[name="idp-target"]');
    const actionsEl = card && card.querySelector('[name="idp-actions"]');
    const target = ((targetEl && targetEl.value) || "").trim();
    const actions = ((actionsEl && actionsEl.value) || "").trim();
    const g = (data.idp[pid]||[]).find(function(x){ return x.id===gid; });
    if(g){
      g.target = target;
      g.actions = actions;
      if((target || actions) && !g.agreed) g.agreed = todayISO();
      if(!target && !actions) g.agreed = "";
      saveData();
      toast(target || actions ? "Target and actions saved" : "Cleared — to be agreed with your coach");
      render();
    }
    return;
  }
  if(act==="add-comment"){
    const pid=t.getAttribute("data-pid"), gid=t.getAttribute("data-gid");
    const area = document.querySelector('textarea[data-cmt="'+gid+'"]');
    const text = (area && area.value || "").trim();
    if(!text){ toast("Write a comment first"); return; }
    const g = (data.idp[pid]||[]).find(function(x){ return x.id===gid; });
    if(g){
      g.comments = g.comments||[];
      g.comments.push({ by:"Coach Morgan", date: new Date().toISOString().slice(0,10), text: text });
      saveData(); toast("Comment added"); render();
    }
    return;
  }
}

function maybeAddShot(){
  if(ui.draft && ui.draft._zone && ui.draft._outcome){
    if(ui.draft._outcome==="Goal" && !ui.draft._goalType){
      toast("Tick how the goal was scored");
      return;
    }
    ui.draft.shots = ui.draft.shots||[];
    const shot = { zone:ui.draft._zone, outcome:ui.draft._outcome };
    if(ui.draft._outcome==="Goal" && ui.draft._goalType) shot.goalType = ui.draft._goalType;
    ui.draft.shots.push(shot);
    toast("Shot added: "+ui.draft._zone+" · "+ui.draft._outcome+(shot.goalType?" · "+goalTypeLabel(shot.goalType):""));
    ui.draft._zone=null; ui.draft._outcome=null; ui.draft._goalType=null;
  }
}

function saveLog(){
  syncDraftFromDom();
  const p = player();
  const d = ui.draft;
  if(!d.matchId){ toast("Select a match"); return; }
  if(!d.minutes){ toast("Enter minutes played"); return; }
  const existing = logFor(p.id, d.matchId);
  const posToStore = (existing && existing.pos) ? existing.pos : (d.pos || posCode(p) || "");
  const form = hasPos(posToStore) ? POS[posToStore].form : "";
  const metrics = draftToMetrics(form, d);
  const entry = {
    matchId:d.matchId, minutes:+d.minutes||0,
    dominant:+d.dominant||0, assertive:+d.assertive||0, connected:+d.connected||0,
    reflection:d.reflection||"", veo:d.veo||"", pos: posToStore, metrics: metrics
  };
  const list = data.logs[p.id] || (data.logs[p.id]=[]);
  const i = list.findIndex(function(l){ return l.matchId===d.matchId; });
  if(i>=0) list[i]=entry; else list.push(entry);
  saveData();
  ui.logMode=null; ui.draft=null;
  toast("Match log saved");
  render();
}

function saveUnit(mid, unit){
  const card = document.querySelector('.unit-card[data-unit="'+unit+'"]');
  if(!card) return;
  const secEl = card.querySelector('[name="'+unit+'-secured"]');
  const unsEl = card.querySelector('[name="'+unit+'-unsecured"]');
  const sec = +(secEl && secEl.value) || 0;
  const uns = +(unsEl && unsEl.value) || 0;
  data.possessions[mid] = data.possessions[mid] || { def:{secured:0,unsecured:0}, mid:{secured:0,unsecured:0}, att:{secured:0,unsecured:0} };
  data.possessions[mid][unit] = { secured:sec, unsecured:uns };
  saveData();
  toast(unit==="def"?"Defence numbers saved": unit==="mid"?"Midfield numbers saved":"Attack numbers saved");
  render();
}

function onInput(ev){
  if(ev.target.closest(".target-card") && ev.target.matches("input[type='number'], input[name^='tgt-']")){ refreshTargetCards(); }
  const sl = ev.target.closest("input[data-act='idp-slider']");
  if(sl){
    const pid=sl.getAttribute("data-pid"), gid=sl.getAttribute("data-gid");
    const g=(data.idp[pid]||[]).find(function(x){ return x.id===gid; });
    if(g){
      g.progress=+sl.value;
      const lab=document.querySelector('[data-pval="'+gid+'"]');
      if(lab) lab.textContent=g.progress+"%";
    }
  }
}
function onChange(ev){
  if(handleShotEntryChange(ev)) return;
  if(handleTeamPanelChange(ev)) return;
  const sl = ev.target.closest("input[data-act='idp-slider']");
  if(sl){ saveData(); toast("Progress updated"); return; }
  if(ev.target.matches("select[data-act='poss-match']")){
    ui.possMatch = ev.target.value;
    render();
    return;
  }
  if(ev.target.matches("select[data-act='coach-match']")){
    ui.coachMatch = ev.target.value;
    render();
    return;
  }
  if(ev.target.matches("select[data-act='assign-pos']")){
    const pid = ev.target.getAttribute("data-id");
    const field = ev.target.getAttribute("data-field") || "pos";
    setPlayerPosition(pid, field, ev.target.value);
    const p = PLAYERS.find(function(x){ return x.id===pid; });
    const name = p ? fullName(p) : "Player";
    if(field==="pos2"){
      toast(ev.target.value ? name+" \u00b7 secondary "+posAssignLabel(ev.target.value) : name+" \u00b7 secondary cleared");
    }else{
      toast(ev.target.value ? name+" \u00b7 "+posAssignLabel(ev.target.value) : name+" \u00b7 position not set");
    }
    render();
    return;
  }
  if(ev.target.matches("select[data-act='coach-pos']")){
    ui.coachPos = ev.target.value;
    render();
    return;
  }
  if(ev.target.matches("select[data-act='coach-sort']")){
    ui.coachSort = ev.target.value;
    render();
    return;
  }
  if(ev.target.matches("select[data-act='scope-team']")){
    ui.coachTeamId = ev.target.value;
    const latest = latestPlayed(ui.coachTeamId);
    ui.coachMatch = latest ? latest.id : null;
    ui.possMatch = ui.coachMatch || ui.possMatch;
    if(ui.shotMatch){
      const sf = fixture(ui.shotMatch);
      if(!sf || sf.teamId!==ui.coachTeamId){ ui.shotMatch=null; ui.shotDraft=null; }
    }
    if(ui.teamPanelMatch){
      const pf = fixture(ui.teamPanelMatch);
      if(!pf || pf.teamId!==ui.coachTeamId){ ui.teamPanelMatch=null; }
    }
    render();
  }
}


function renderMetricsFields(form, m){
  const p = player();
  const pos = (ui.draft && ui.draft.pos) || posCode(p);
  const set = hasPos(pos);
  m = normalizeMetrics(m);
  if(!set){
    return '<div class="notice">Ask your coach to set your position. Until then you can still log AVP counts, a short reflection, and Dominant / Assertive / Connected ratings.</div>' +
      '<div><div class="fld-label">AVP events</div><div class="grid-2">' +
        '<label class="fld"><span>Created\u2013Pass</span>'+stepper("avpCrePass", m.avpCrePass)+"</label>" +
        '<label class="fld"><span>Created\u2013Dribble</span>'+stepper("avpCreDribble", m.avpCreDribble)+"</label>" +
        '<label class="fld"><span>Received\u2013Between</span>'+stepper("avpRecBetween", m.avpRecBetween)+"</label>" +
        '<label class="fld"><span>Received\u2013Behind</span>'+stepper("avpRecBehind", m.avpRecBehind)+"</label></div></div>";
  }
  const pr = prof(pos);
  let html = '<div class="notice">Log your attacking and defensive match targets with the +/- counters, plus AVP counts. Reflection and Dominant / Assertive / Connected ratings stay common to every position'+(pr.shots?". Shot zone and outcome are optional for this role.":".")+"</div>" +
    '<div class="goals-pair">' +
      renderTargetCard(pos, "attacking", m, { counters:true }) +
      renderTargetCard(pos, "defensive", m, { counters:true }) +
    "</div>" +
    '<div><div class="fld-label">AVP events</div><div class="grid-2">' +
      '<label class="fld"><span>Created\u2013Pass</span>'+stepper("avpCrePass", m.avpCrePass)+"</label>" +
      '<label class="fld"><span>Created\u2013Dribble</span>'+stepper("avpCreDribble", m.avpCreDribble)+"</label>" +
      '<label class="fld"><span>Received\u2013Between</span>'+stepper("avpRecBetween", m.avpRecBetween)+"</label>" +
      '<label class="fld"><span>Received\u2013Behind</span>'+stepper("avpRecBehind", m.avpRecBehind)+"</label></div></div>";
  if(pr.shots){
    const sel = ui.draft && ui.draft._zone || null;
    const out = ui.draft && ui.draft._outcome || null;
    const gtype = ui.draft && ui.draft._goalType || null;
    const shots = (ui.draft && ui.draft.shots) || m.shots || [];
    html += '<div><div class="fld-label">Shots (optional) - tap a zone, then an outcome</div>' +
      '<p class="hint">Optional extra for attacking roles. If the outcome is a goal, tick whether it came from a secured possession (4+ passes) or a 4 to score counter (3 passes or fewer). Position targets are still yours to track as before.</p>' +
      '<div class="pitch-wrap" data-shot-pitch="1">'+pitchSVG({ selected: sel })+"</div>"+zoneLegend() +
      '<div class="outcome-picks">' +
        OUTCOMES.map(function(o){ return '<button type="button" data-act="shot-outcome" data-val="'+o.id+'" class="'+(out===o.id?"on":"")+'">'+o.label+"</button>"; }).join("") +
      "</div>" +
      (out==="Goal" || (sel && out==="Goal")
        ? '<div class="goal-type-picks"><div class="fld-label">How was this goal scored?</div>' +
            GOAL_TYPES.map(function(g){ return '<button type="button" data-act="goal-type" data-val="'+g.id+'" class="'+(gtype===g.id?"on":"")+'">'+esc(g.label)+"</button>"; }).join("") +
          "</div>"
        : "") +
      '<div class="shot-list">' +
        (shots.length ? shots.map(function(s,i){
          const goal = s.outcome==="Goal";
          return '<div class="shot-chip'+(goal && !s.goalType?" needs-type":"")+'"><span style="background:var(--'+s.zone.toLowerCase()+');width:10px;height:10px;border-radius:2px"></span>'+s.zone+" \u00b7 "+esc(s.outcome) +
            (goal ? '<div class="goal-type-inline">'+GOAL_TYPES.map(function(g){ return '<button type="button" data-act="goal-type" data-i="'+i+'" data-val="'+g.id+'" class="'+(s.goalType===g.id?"on":"")+'">'+esc(g.label)+"</button>"; }).join("")+"</div>" : "") +
            '<button type="button" data-act="del-shot" data-i="'+i+'" aria-label="Remove shot">Remove</button></div>';
        }).join("") : '<p class="hint">No shots logged yet.</p>') +
      "</div></div>";
  }
  return html;
}


ui.shotMatch = ui.shotMatch || null;
ui.shotSide = ui.shotSide || "us";
ui.shotDraft = ui.shotDraft || null;
ui.veoOpen = !!ui.veoOpen;
ui.teamPanelMatch = ui.teamPanelMatch || null;

bind();
render();

window.SCFCPortal = {
  loginPlayer: function(id){ ui.role="player"; ui.playerId=id||"avery"; ui.page="dashboard"; ui.logMode=null; ui.vid=null; ui.pointVid=null; ui.benchInfo=false; render(); window.scrollTo(0,0); },
  loginCoach: function(){ ui.role="coach"; ui.page="squad"; ui.coachPlayerId=null; ui.coachTeamId=null; ui.coachAssign=false; ui.vid=null; ui.pointVid=null; ui.benchInfo=false; ui.teamPanelMatch=null; render(); window.scrollTo(0,0); },
  go: function(page, extra){ Object.assign(ui, extra||{}, { page: page }); render(); },
  ui: ui,
  computeTeamPanel: computeTeamPanel,
  teamGoalSplit: teamGoalSplit,
  seasonGoalSplit: seasonGoalSplit,
  effectiveSecured: effectiveSecured
};
})();
</script>
