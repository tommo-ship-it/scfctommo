<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102048">
<title>SCFC Performance Phase · Player Portal (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --navy:#102048;--navy-deep:#09102a;--navy-mid:#18265a;--navy-soft:#26386b;
  --gold:#D4AF37;--gold-soft:#fff3c4;--gold-dark:#b8901c;--gold-hover:#c9a42e;
  --ink:#1c2233;--muted:#4A5368;--faint:#7a8496;
  --mist:#EFF2F6;--line:#DDE3EC;--card:#fff;--bg:#f3f5f9;
  --success:#1f7a4d;--success-bg:#e8f6ee;--danger:#b42318;--danger-bg:#fdecea;
  --info:#1565c0;--info-bg:#e8f1fb;--warn:#c05616;--warn-bg:#fff1e6;
  --z1:#c44536;--z2:#e07a2f;--z3:#e2b009;--z4:#2e6bb0;--z5:#2e6bb0;--z6:#4a6b5c;
  --shadow:0 8px 28px rgba(16,32,72,.08);--shadow-sm:0 2px 8px rgba(16,32,72,.06);
  --radius:16px;--radius-sm:10px;
  --header-h:58px;--nav-h:64px;--proto-h:28px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:Lato,system-ui,-apple-system,Segoe UI,sans-serif;
  --display:Oswald,Lato,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;min-height:100%}
body{padding-bottom:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
p{margin:0}
a{color:var(--navy-mid)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}

/* Prototype bar */
.proto{
  height:var(--proto-h);background:var(--gold);color:var(--navy-deep);
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;
  position:sticky;top:0;z-index:50;white-space:nowrap;overflow:hidden;
}
.proto span{opacity:.85;font-weight:400;letter-spacing:.02em;text-transform:none;display:none}
@media (min-width:640px){ .proto span{display:inline} }

/* ===== LOGIN ===== */
.login{
  min-height:100dvh;background:linear-gradient(165deg,var(--navy-deep) 0%,var(--navy) 55%,#1a2d68 100%);
  color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.login::before{
  content:"";position:absolute;inset:-20% -10% auto auto;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.18),transparent 70%);pointer-events:none;
}
.login-inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;max-width:460px;margin:0 auto;width:100%;padding:12px 22px 36px}
.login-crest{width:92px;height:auto;margin:18px auto 16px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.login h1{text-align:center;font-size:28px;color:#fff;margin:0 0 6px}
.login .sub{text-align:center;color:var(--gold);font-family:var(--display);letter-spacing:.16em;font-size:13px;font-weight:600;margin-bottom:8px}
.login .tagline{text-align:center;color:rgba(255,255,255,.78);font-size:14.5px;margin:0 0 8px}
.identity-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 22px}
.chip-id{border:1px solid rgba(212,175,55,.55);color:var(--gold-soft);padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.login-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:20px;
  padding:20px 18px 18px;backdrop-filter:blur(8px);
}
.login-card h2{font-size:13px;color:var(--gold);letter-spacing:.14em;margin-bottom:6px;text-align:center}
.login-card p.note{text-align:center;color:rgba(255,255,255,.7);font-size:13.5px;margin-bottom:16px}
.role-btns{display:flex;flex-direction:column;gap:10px}
a.btn{text-decoration:none;color:inherit}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s,box-shadow .15s;text-align:center}
.btn svg{width:16px;height:16px;flex:none}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold);color:var(--navy-deep);box-shadow:0 6px 16px rgba(212,175,55,.28)}
.btn-gold:hover{background:var(--gold-hover)}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft)}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn-outline:hover{border-color:var(--navy);background:var(--mist)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.login-foot{margin-top:auto;padding-top:22px;text-align:center;color:rgba(255,255,255,.5);font-size:12px}
.login-foot strong{color:rgba(255,255,255,.75);font-weight:700}

/* ===== APP SHELL ===== */
.app{min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.app-header{
  position:sticky;top:var(--proto-h);z-index:40;background:var(--navy);color:#fff;
  height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 12px 0 10px;
  box-shadow:0 2px 10px rgba(9,16,42,.25);
}
.app-header .crest{width:32px;height:41px;object-fit:contain;flex:none}
.brand{flex:1;min-width:0}
.brand .kicker{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{font-size:14px;color:#fff;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:6px;flex:none}
.player-switch{position:relative}
.player-switch-btn{
  appearance:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:#fff;border-radius:999px;padding:5px 10px 5px 8px;display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;max-width:168px;
}
.player-switch-btn .pos-badge{background:var(--gold);color:var(--navy-deep);border-radius:999px;padding:1px 6px;font-size:10px;letter-spacing:.04em}
.player-switch-btn .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78px}
.player-switch-btn svg{width:12px;height:12px;opacity:.8;flex:none}
.menu-pop{
  position:absolute;right:0;top:calc(100% + 6px);background:#fff;color:var(--ink);
  border-radius:14px;box-shadow:0 16px 40px rgba(16,32,72,.22);min-width:240px;max-height:70vh;overflow:auto;
  border:1px solid var(--line);z-index:60;padding:6px;
}
.menu-pop .group-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px}
.menu-item:hover,.menu-item:focus{background:var(--mist)}
.menu-item.active{background:var(--gold-soft)}
.menu-item .meta{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700}
.icon-btn{appearance:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}

/* Desktop sidebar + main */
.app-body{display:flex;flex:1;min-height:0}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:14px 14px calc(var(--nav-h) + var(--safe-b) + 16px);max-width:980px;width:100%;margin:0 auto}

/* Bottom nav */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:4px 4px calc(6px + var(--safe-b));
  height:calc(var(--nav-h) + var(--safe-b));
}
.nav-item{
  flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.02em;padding:4px 0;border-radius:10px;
}
.nav-item svg{width:22px;height:22px}
.nav-item.active{color:var(--navy)}
.nav-item.active svg{stroke:var(--navy)}
.nav-item.active{position:relative}
.nav-item.active::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

/* More sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(9,16,42,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:10px 16px calc(20px + var(--safe-b));
  box-shadow:0 -8px 30px rgba(16,32,72,.2);animation:sheetUp .22s ease;
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-handle{width:36px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:14px;margin-bottom:10px}
.sheet-link{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--mist);padding:13px 2px;text-align:left;font-weight:700;color:var(--navy)}
.sheet-link svg{width:20px;height:20px;stroke:var(--navy-soft)}
.sheet-link span.desc{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:1px}

/* ===== SHARED UI ===== */
.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.page-title > div{flex:1;min-width:0}
.page-title h2{font-size:22px}
.page-title p{color:var(--muted);font-size:13px;margin-top:3px;text-transform:none;letter-spacing:0;font-family:var(--font);font-weight:400}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--gold-soft);color:var(--navy);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 8px}
.badge-navy{background:var(--navy);color:var(--gold)}
.badge-muted{background:var(--mist);color:var(--muted)}
.badge-sync{background:var(--info-bg);color:var(--info)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
.card + .card{margin-top:12px}
.card h3{font-size:13px;letter-spacing:.12em;color:var(--navy);margin-bottom:10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-head h3{margin:0}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{
  background:var(--mist);border-radius:var(--radius-sm);padding:12px 10px;text-align:center;min-width:0;
}
.stat .num{font-family:var(--display);font-size:26px;letter-spacing:.04em;color:var(--navy);line-height:1}
.stat .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stat.gold{background:linear-gradient(180deg,#fff8e0,var(--gold-soft))}
.stat.navy{background:var(--navy);color:#fff}
.stat.navy .num{color:var(--gold)}
.stat.navy .lbl{color:rgba(255,255,255,.7)}

.hero-player{
  background:linear-gradient(135deg,var(--navy-deep),var(--navy-soft));
  color:#fff;border:0;padding:18px 16px 16px;position:relative;overflow:hidden;
}
.hero-player::after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.2),transparent 70%)}
.hero-player .hello{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hero-player h2{font-size:24px;color:#fff;margin:4px 0 8px;text-transform:none;letter-spacing:.02em}
.hero-player .roles{display:flex;flex-wrap:wrap;gap:6px}
.hero-player .sample{margin-top:10px;font-size:12px;color:rgba(255,255,255,.65)}

.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--navy-mid),var(--gold));border-radius:99px}
.progress-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.progress-row .progress{flex:1}
.progress-row .pct{font-weight:700;font-size:13px;color:var(--navy);min-width:36px;text-align:right}

.id-meters{display:grid;grid-template-columns:1fr;gap:8px}
.id-meter{display:grid;grid-template-columns:88px 1fr 28px;align-items:center;gap:8px}
.id-meter .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.dots{display:flex;gap:4px}
.dot{width:18px;height:8px;border-radius:99px;background:var(--line)}
.dot.on{background:var(--gold)}

.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--mist)}
.list-row:last-child{border-bottom:0;padding-bottom:0}
.list-row .when{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;min-width:64px}
.list-row .body{flex:1;min-width:0}
.list-row .body strong{display:block;font-size:14px}
.list-row .body small{color:var(--muted);font-size:12px}
.list-row .end{font-weight:700;color:var(--navy);font-size:13px;text-align:right}

/* Fixtures */
.fx-note{font-size:12px;color:var(--info);background:var(--info-bg);border-radius:8px;padding:8px 10px;margin-bottom:10px}

/* Match cards / timeline */
.timeline{display:flex;flex-direction:column;gap:12px}
.match-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.match-card header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy);color:#fff;cursor:pointer}
.match-card header .mid{flex:1;min-width:0}
.match-card header .opp{font-family:var(--display);letter-spacing:.06em;font-size:16px}
.match-card header .meta{font-size:11px;color:rgba(255,255,255,.7)}
.match-card header .score{font-family:var(--display);font-size:20px;color:var(--gold)}
.match-card .body{padding:12px 14px 14px}
.match-card .empty-log{color:var(--muted);font-size:13.5px;padding:4px 0 8px}

/* Forms */
.form-grid{display:grid;gap:12px}
label.fld{display:block}
label.fld > span, .fld-label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{
  width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);
}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-soft);box-shadow:0 0 0 3px rgba(16,32,72,.12)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:42px;height:42px;border:0;background:var(--mist);color:var(--navy);font-size:20px;font-weight:700;flex:none}
.stepper input{border:0;text-align:center;padding:0;height:42px;font-weight:700;font-size:16px;border-radius:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pair-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.rate{display:flex;gap:6px}
.rate button{
  flex:1;height:40px;border:1.5px solid var(--line);background:#fff;border-radius:8px;
  font-weight:800;color:var(--muted);
}
.rate button.on{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.id-block{background:var(--mist);border-radius:12px;padding:12px}
.id-block + .id-block{margin-top:8px}
.id-block .prompt{font-size:12.5px;color:var(--muted);margin:0 0 8px}

/* Shot zone */
.pitch-wrap{background:#1a6b3c;border-radius:12px;padding:10px;overflow:hidden}
svg.pitch{width:100%;height:auto;display:block}
svg.pitch .zone{cursor:pointer;stroke:#fff;stroke-width:1.2;opacity:.92}
svg.pitch .zone:hover,svg.pitch .zone:focus{opacity:1;stroke:var(--gold);stroke-width:2.2}
svg.pitch .zone.sel{stroke:var(--gold);stroke-width:2.4;filter:brightness(1.08)}
svg.pitch text{font-family:var(--display);fill:#fff;font-size:11px;letter-spacing:.06em;pointer-events:none;text-anchor:middle}
svg.pitch .zlbl{font-size:8px;letter-spacing:.04em;opacity:.95}
.zone-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.zone-legend div{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--muted)}
.swatch{width:10px;height:10px;border-radius:2px;flex:none;margin-top:2px}
.shot-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.shot-chip{display:flex;align-items:center;gap:8px;background:var(--mist);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
.shot-chip button{margin-left:auto;border:0;background:none;color:var(--danger);font-weight:700;padding:4px}
.outcome-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.outcome-picks button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;font-weight:700;font-size:13px}
.outcome-picks button.on{border-color:var(--navy);background:var(--navy);color:#fff}

/* IDP */
.idp-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;margin-bottom:12px}
.idp-card .pillar{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;background:var(--navy);color:var(--gold)}
.idp-card .inner{padding:14px}
.idp-card h4{font-size:16px;text-transform:none;letter-spacing:.01em;margin-bottom:6px}
.idp-card .target,.idp-card .actions{font-size:13.5px;color:var(--ink);margin:6px 0}
.idp-card .target strong,.idp-card .actions strong{color:var(--muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px;font-family:var(--font)}
input[type=range]{width:100%;accent-color:var(--navy);height:24px}
.comments{margin-top:12px;background:var(--mist);border-radius:10px;padding:10px}
.comments h5{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--font)}
.comment{font-size:13.5px;padding:6px 0;border-bottom:1px solid #e3e7ee}
.comment:last-child{border-bottom:0}
.comment .by{font-weight:700;color:var(--navy);font-size:12px}
.reviews{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reviews span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--muted)}
.reviews span.done{background:var(--success-bg);border-color:#b7e0c6;color:var(--success)}

/* Positions */
.pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.pos-tab{
  appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;
  font-family:var(--display);font-size:14px;letter-spacing:.06em;color:var(--navy);
}
.pos-tab.on{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.pos-profile .lead{font-size:15px;margin-bottom:12px}
.pos-profile h3{margin:14px 0 6px}
.pos-profile ul{margin:0;padding:0 0 0 18px;color:var(--ink)}
.pos-profile li{margin:5px 0}
.pos-dac{display:grid;gap:8px;margin:12px 0}
.pos-dac div{background:var(--mist);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 12px}
.pos-dac strong{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);margin-bottom:2px}

/* Learning */
.vid-grid{display:grid;gap:12px}
.vid{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)
}
.vid-thumb{
  background:linear-gradient(160deg,var(--navy-deep),var(--navy-soft));
  aspect-ratio:16/9;display:grid;place-items:center;position:relative;
}
.vid-thumb .play{width:56px;height:56px;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.vid-thumb .play svg{width:22px;height:22px;margin-left:2px}
.vid-thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px}
.vid-body{padding:12px 14px 14px}
.vid-body h3{font-size:15px;text-transform:none;letter-spacing:.02em;margin-bottom:4px}
.vid-body p{font-size:13.5px;color:var(--muted)}
.vid-modal{position:fixed;inset:0;background:rgba(9,16,42,.72);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.vid-modal .box{background:#fff;border-radius:16px;max-width:520px;width:100%;overflow:hidden}
.vid-modal .fake{background:var(--navy);aspect-ratio:16/9;display:grid;place-items:center;color:var(--gold);text-align:center;padding:20px}
.vid-modal .box .txt{padding:14px 16px 18px}

/* Possession */
.formula{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;margin:8px 0 12px}
.formula code{color:var(--gold);font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.unit-grid{display:grid;gap:10px}
.unit-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.unit-card h4{font-size:14px;text-transform:none;letter-spacing:.02em;margin-bottom:4px}
.unit-card .who{font-size:12px;color:var(--muted);margin-bottom:8px}
.sf-big{font-family:var(--display);font-size:48px;color:var(--navy);letter-spacing:.04em;line-height:1}
.sf-big span{font-size:18px;color:var(--muted)}

/* Coach */
.squad-list{display:flex;flex-direction:column;gap:8px}
.squad-row{
  display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%;
  box-shadow:var(--shadow-sm);
}
.squad-row .ava{
  width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--gold);
  display:grid;place-items:center;font-family:var(--display);font-size:14px;letter-spacing:.04em;
}
.squad-row .nm{font-weight:700;color:var(--navy);font-size:14.5px}
.squad-row .sub{font-size:12px;color:var(--muted)}
.coach-comment-form{margin-top:10px;display:grid;gap:8px}

/* Toast */
.toast{position:fixed;left:50%;top:calc(var(--proto-h) + var(--header-h) + 10px);transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;
  box-shadow:0 8px 24px rgba(16,32,72,.3);z-index:90;animation:fadeUp .2s ease;max-width:calc(100% - 24px);text-align:center}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translateX(-50%)}}

/* Log panel (full page-ish) */
.log-panel .back{margin-bottom:10px;width:auto;max-width:100%}

/* Empty / notice */
.notice{font-size:13px;color:var(--muted);background:var(--mist);border-radius:10px;padding:10px 12px}

/* Desktop */
@media (min-width:860px){
  .bottom-nav{display:none}
  .sidebar{
    display:flex;flex-direction:column;width:230px;flex:none;background:var(--navy-deep);color:#fff;
    padding:16px 10px;position:sticky;top:calc(var(--proto-h) + var(--header-h));height:calc(100dvh - var(--proto-h) - var(--header-h));
  }
  .sidebar .nav-item{flex:none;width:100%;flex-direction:row;justify-content:flex-start;gap:10px;color:rgba(255,255,255,.72);font-size:13.5px;padding:10px 12px;letter-spacing:0}
  .sidebar .nav-item.active{background:rgba(255,255,255,.08);color:#fff;border-radius:10px}
  .sidebar .nav-item.active::after{display:none}
  .sidebar .nav-item svg{width:18px;height:18px}
  .sidebar .side-foot{margin-top:auto;padding:12px 10px;font-size:11px;color:rgba(255,255,255,.45)}
  .main{padding:22px 28px 40px;max-width:1100px}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .id-meters{grid-template-columns:1fr}
  .vid-grid{grid-template-columns:1fr 1fr}
  .unit-grid{grid-template-columns:repeat(3,1fr)}
  .pos-grid{grid-template-columns:repeat(8,1fr)}
  .player-switch-btn{max-width:220px}
  .player-switch-btn .name{max-width:120px}
  .zone-legend{grid-template-columns:repeat(3,1fr)}
  .app-body{align-items:stretch}
  .sidebar .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 8px}
}
@media (min-width:1100px){
  .vid-grid{grid-template-columns:1fr 1fr 1fr}
}

.save-counts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.save-counts div{background:#fff;border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;font-weight:700;color:var(--navy)}
.save-counts b{display:block;font-family:var(--display);font-size:16px;letter-spacing:.04em}

/* Position profile (PDF structure) */
.strapline{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:var(--mist);border-radius:8px;padding:8px 10px;margin:8px 0 14px}
.goals-pair{display:grid;gap:10px;margin:0 0 14px}
@media (min-width:640px){ .goals-pair{grid-template-columns:1fr 1fr} }
.goal-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm)}
.goal-card .kind{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:6px}
.goal-card .goal-text{font-size:15px;font-weight:700;color:var(--navy);line-height:1.35}
.goal-card .src{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.goal-card.placeholder{border-style:dashed;background:#fafbfc}
.goal-card.placeholder .goal-text{color:var(--muted);font-weight:700}

.profile-grid{display:grid;gap:12px}
.ao-col h3,.do-col h3{margin-bottom:8px;font-size:12px}
.zone-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.zone-box .zh{background:#fff3c4;color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:5px 8px;margin:-10px -12px 8px;border-bottom:1px solid #f0e0a0}
.zone-box.do .zh{background:#e8eef8;border-bottom-color:#d3dced}
.zone-box ul{margin:0;padding:0 0 0 16px}
.zone-box li{margin:4px 0;font-size:13.5px}

.phase-map{background:#1a6b3c;border-radius:12px;padding:8px}
.phase-map svg{width:100%;height:auto;display:block}

.metrics-table{width:100%;border-collapse:collapse;font-size:13px}
.metrics-table th{background:var(--navy);color:#fff;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:8px 10px}
.metrics-table td{padding:8px 10px;border-bottom:1px solid var(--mist);vertical-align:top}
.metrics-table tr:nth-child(even) td{background:#f7f8fb}
.src-pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--navy);color:var(--navy);white-space:nowrap}
.src-pill.veo{background:var(--navy);color:#fff;border-color:var(--navy)}
.src-pill.model{background:var(--gold);color:var(--navy-deep);border-color:var(--gold)}
.src-pill.player{background:#fff}
.src-pill.mix{background:#fff;border-color:var(--navy-soft)}

@media (min-width:860px){
  .profile-grid{grid-template-columns:1fr 220px 1fr;align-items:start}
}

.nav-item span{text-align:center;line-height:1.15;max-width:4.8em}
.unit-card.mine{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.18)}
.unit-card .window{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--navy);margin:2px 0 8px}
.unit-card .third{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:2px}

.zone-box ul{margin:0;padding:0;list-style:none}
.zone-box li{margin:0}
.work-point{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:transparent;border:0;padding:8px 4px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink);-webkit-tap-highlight-color:transparent}
.work-point:hover,.work-point:focus-visible{background:#f4f6fb;outline:none}
.work-point .play-ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--gold);margin-top:1px;box-shadow:0 1px 0 rgba(16,32,72,.08)}
.work-point .play-ic svg{width:11px;height:11px;display:block;margin-left:1px}
.work-point .pt{flex:1;font-size:13.5px;line-height:1.4;padding-top:1px}
.work-point .soon-lab,.work-point .vid-src-lab{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.work-point .soon-lab{color:#8b93a7}
.work-point .vid-src-lab{color:var(--gold-dark)}
.work-point.soon{color:#3a4258}
.work-point.soon .play-ic{background:#e7eaf1;box-shadow:none;border:1px dashed #b4b9c7}
.work-point.soon .play-ic svg{fill:#8b93a7;opacity:.9}
.work-point.has-vid .play-ic{background:var(--gold)}
.vid-modal .vid-frame{background:#000;aspect-ratio:16/9;width:100%}
.vid-modal .vid-frame iframe,.vid-modal .vid-frame video{width:100%;height:100%;border:0;display:block;background:#000}
.vid-modal .fake.coming{background:#1a2344}
.vid-modal .fake .vk{font-family:var(--display);letter-spacing:.12em;font-size:13px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.vid-modal .vid-kicker{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:6px}
.vid-modal .vid-caption{font-size:15px;font-weight:700;color:var(--navy);line-height:1.35;margin:0 0 10px}
.vid-modal .point-edit{margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.vid-modal .box.point-vid-box{max-width:560px;max-height:calc(100vh - 24px);overflow:auto;-webkit-overflow-scrolling:touch}
@media (max-width:430px){
  .vid-modal{padding:8px;align-items:flex-end}
  .vid-modal .box.point-vid-box{border-radius:16px 16px 12px 12px;max-height:calc(100vh - 16px)}
}

.avp-card{margin:12px 0}
.avp-head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.info-btn{appearance:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--navy);display:grid;place-items:center;padding:0;flex:none}
.info-btn svg{width:14px;height:14px;display:block}
.info-btn:hover,.info-btn:focus-visible{border-color:var(--navy);background:var(--gold-soft);outline:none}
.avp-rate-lg{font-family:var(--display);font-size:42px;color:var(--navy);letter-spacing:.04em;line-height:1;text-align:center;margin:4px 0 12px}
.avp-rate-lg small{display:block;font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.avp-track{position:relative;height:10px;border-radius:99px;background:#e6e9f0;display:flex;overflow:visible;margin:10px 2px 0}
.avp-track .seg{height:10px;display:block}
.avp-track .seg:first-child{border-radius:99px 0 0 99px}
.avp-track .seg:last-child{border-radius:0 99px 99px 0}
.avp-track .g-below{background:#d5d9e3}
.avp-track .g-good{background:#8ea0c8}
.avp-track .g-better{background:#e0c56a}
.avp-track .g-best{background:var(--gold)}
.avp-track .g-pro{background:var(--navy)}
.avp-marker{position:absolute;top:-5px;width:6px;height:20px;background:var(--navy-deep);border:2px solid #fff;border-radius:3px;transform:translateX(-50%);box-shadow:0 1px 4px rgba(16,32,72,.35);z-index:1}
.avp-split{margin-top:6px}
.avp-split-labs{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--navy)}
.avp-split-labs em{font-style:normal;color:var(--muted);font-weight:600}
.avp-split-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#e6e9f0;margin-top:4px}
.avp-split-bar .cre{background:var(--navy);height:100%}
.avp-split-bar .rec{background:var(--gold);height:100%}
.avp-notes{margin-top:10px}
.avp-notes p{font-size:12.5px;color:var(--muted);margin:0 0 6px;line-height:1.4}
.avp-notes .aspirational,.lead-about + .aspirational,p.aspirational,.aspirational{display:block;color:var(--navy);background:var(--gold-soft);border-radius:8px;padding:8px 10px;font-weight:600;line-height:1.4}
.avp-compact{background:var(--mist);border-radius:12px;padding:10px 12px;margin:8px 0}
.avp-compact-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.avp-rate{font-family:var(--display);font-size:26px;color:var(--navy);letter-spacing:.04em;line-height:1}
.avp-rate small{font-family:var(--font);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.tier-badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tier-below{background:#eceef3;color:#5c6478}
.tier-good{background:#e8eef8;color:var(--navy)}
.tier-better{background:#fff3c4;color:#7a5d0a}
.tier-best{background:var(--gold);color:var(--navy-deep)}
.tier-pro{background:var(--navy);color:var(--gold)}
.tier-na,.tier-none{background:var(--mist);color:var(--muted)}
.squad-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bench-modal .box{max-width:560px;max-height:calc(100vh - 24px);overflow:auto}
.bench-modal h3{margin:0 0 8px}
.lead-about{font-size:14px;color:var(--ink);margin:0 0 10px;text-transform:none;letter-spacing:0;font-family:var(--font);font-weight:400;line-height:1.45}
.about-list{margin:6px 0 12px;padding:0 0 0 18px;font-size:13px;color:var(--ink)}
.about-list li{margin:4px 0}
.about-bench td{white-space:nowrap}
.list-row .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.avp-legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0 4px;font-size:11px;font-weight:700;color:var(--navy)}
.avp-legend span{display:flex;align-items:center;gap:6px}
.avp-legend i{width:10px;height:10px;border-radius:3px;flex:none;display:block}
.avp-legend i.g-good{background:#8ea0c8}
.avp-legend i.g-better{background:#e0c56a}
.avp-legend i.g-best{background:var(--gold)}
.avp-legend i.g-pro{background:var(--navy)}
.about-map{display:flex;flex-direction:column;gap:0;margin:6px 0 10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.about-map-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 10px;border-bottom:1px solid var(--mist);background:#fff}
.about-map-row:nth-child(even){background:#f7f8fb}
.about-map-row:last-child{border-bottom:0}
.about-map-row .am-pos{font-size:13px;font-weight:700;color:var(--navy);line-height:1.3}
.about-map-row .am-pos span{display:block;font-weight:600;color:var(--muted);font-size:12px}
.about-map-row .am-vals{font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap;letter-spacing:.01em}

.notice-with-info{display:flex;align-items:flex-start;gap:8px}
.notice-with-info span{flex:1}
.notice-with-info .info-btn{margin-top:1px}

.target-card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm)}
.target-card + .target-card, .goals-pair .target-card{margin:0}
.target-card .kind{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dark)}
.target-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.target-state{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tgt-frac{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.02em}
.tgt-hit,.tgt-wait{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.tgt-hit{background:var(--success-bg);color:var(--success)}
.tgt-wait{background:var(--warn-bg);color:var(--warn)}
.target-card.hit{border-color:#9fd0b5;background:#f6fbf8}
.target-card.not-yet{border-color:var(--line)}
.target-card .fld{margin-top:8px}
.target-view .tgt-season{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--navy)}
.tgt-breakdown{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.tgt-dash{margin:12px 0}
.tgt-match-row{display:grid;gap:8px;margin:8px 0}
.tgt-rates{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tgt-rates .tr{display:inline-flex;align-items:center;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tgt-rates .tr.all{background:var(--success-bg);color:var(--success)}
.tgt-rates .tr.some{background:var(--gold-soft);color:#7a5d0a}
.tgt-rates .tr.none{background:#eceef3;color:#5c6478}
.goal-card.target-view .kind{color:var(--gold-dark)}

/* Coach teams */
.team-grid{display:flex;flex-direction:column;gap:10px}
.team-card{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow-sm);
}
.team-card:active,.team-card:focus{border-color:var(--navy);outline:none}
.team-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.team-card-head h3{font-size:16px;letter-spacing:.06em;margin:0}
.team-card-head .sub{font-size:12px;color:var(--muted);margin-top:2px;text-transform:none;letter-spacing:0;font-family:var(--font);font-weight:400}
.team-card .sync-line{font-size:11px;color:var(--info);margin:2px 0 8px}
.team-card .latest{font-size:13px;color:var(--ink);margin-bottom:10px}
.logs-line{display:grid;gap:6px}
.logs-line .logs-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.logs-line .logs-label strong{color:var(--navy);font-weight:800}
.unit-row{font-size:12.5px;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px}
.unit-tick{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--mist);color:var(--faint);font-size:11px;font-weight:800}
.unit-tick.on{background:var(--success-bg);color:var(--success)}
.idp-line{font-size:12.5px;color:var(--muted);margin-top:8px}
.idp-line strong{color:var(--navy)}
.team-metrics{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:2px}
.filter-row{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.filter-chips{display:flex;flex-wrap:wrap;gap:8px}
.filter-selects{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip-filter{
  appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--navy);
}
.chip-filter.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.mini-select{display:grid;gap:2px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.mini-select select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 8px;font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--navy)}
.st-badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.st-logged{background:var(--success-bg);color:var(--success)}
.st-notlogged{background:var(--mist);color:var(--muted)}
.st-late{background:var(--danger-bg);color:var(--danger)}
.st-due{background:var(--warn-bg);color:var(--warn)}
.st-overdue{background:var(--danger-bg);color:var(--danger)}
.status-row{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.team-player{align-items:start}
.team-overview{margin-bottom:12px}

/* IDP blanks */
.idp-card .fld{margin-top:0}
.idp-card textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  background:#fff;resize:vertical;min-height:64px;line-height:1.45;
}
.idp-card textarea::placeholder{color:var(--faint)}
.idp-agreed{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--success)}
.idp-not-started{margin-top:12px;font-size:12.5px;color:var(--muted)}
.idp-dash-empty{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:auto}

/* Attacking metrics */
.att-panel .att-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.att-metric{background:var(--mist);border-radius:var(--radius-sm);padding:12px 10px;min-width:0}
.att-metric .att-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px}
.att-metric .lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.att-metric .num{font-family:var(--display);font-size:28px;letter-spacing:.04em;color:var(--navy);line-height:1.05}
.att-metric .num.wait,.att-metric .num.empty{
  font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;line-height:1.3;
}
.att-metric .num.wait{color:var(--info)}
.att-metric .num.empty{color:var(--muted)}
.att-metric .dir{font-size:11px;color:var(--muted);margin-top:4px}
.att-metric .att-formula{font-size:11px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.att-explainer{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.45}
.att-trend{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 6px;white-space:nowrap}
.att-trend.good{background:var(--success-bg);color:var(--success)}
.att-trend.bad{background:var(--danger-bg);color:var(--danger)}
.att-trend.flat{background:var(--mist);color:var(--muted)}
.att-season-list{display:grid;gap:8px}
.att-season-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:13px}
.att-season-row .name{font-weight:700;color:var(--navy)}
.att-season-row .avg,.att-season-row .latest{color:var(--ink);text-align:right}
.att-season-row .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.att-season-row .avg.wait{color:var(--info);font-weight:700;font-size:12px;grid-column:2 / -1}
@media (max-width:360px){
  .att-season-row{grid-template-columns:1fr 1fr;gap:2px 8px}
  .att-season-row .name{grid-column:1 / -1}
}

/* Assign positions */
.assign-list{display:flex;flex-direction:column;gap:10px}
.assign-row{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;
  box-shadow:var(--shadow-sm);display:grid;gap:8px;
}
.assign-who{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.assign-who .ava{
  width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--gold);
  display:grid;place-items:center;font-family:var(--display);font-size:14px;letter-spacing:.04em;
}
.assign-who .nm{font-weight:700;color:var(--navy);font-size:14.5px}
.assign-who .sub{font-size:12px;color:var(--muted)}
.pos-assign-select{
  width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;
  padding:8px 10px;font-size:14px;font-weight:700;color:var(--navy);
}



/* Coach shot entry */
.shot-entry-launch{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.shot-entry-meta{font-size:12.5px;font-weight:700;color:var(--navy);margin:0 0 8px}
.mismatch-flag{color:#9b2c2c;font-weight:800}
.shot-side-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 6px}
.shot-side-toggle button{
  border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;
  padding:10px 8px;font-weight:800;font-size:13.5px;font-family:inherit;
}
.shot-side-toggle button b{display:inline-block;margin-left:4px;color:var(--muted);font-weight:800}
.shot-side-toggle button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.shot-side-toggle button.on b{color:var(--gold)}
.shot-side-note{margin:0 0 8px}
svg.pitch.entry-pitch .entry-dot{cursor:pointer}
svg.pitch.entry-pitch .entry-dot .dot-n{
  font-size:6.5px;font-family:var(--display);fill:#102048;text-anchor:middle;pointer-events:none;letter-spacing:0;
}
.entry-legend{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:8px 2px 10px;font-size:12px;color:var(--muted);font-weight:700}
.entry-legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;border:1.5px solid var(--navy);vertical-align:middle;margin-right:4px}
.entry-legend .dot.goal{background:var(--gold);box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--navy);width:11px;height:11px}
.zone-count-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.zone-count{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 8px 7px;text-align:center}
.zone-count .zid{font-family:var(--display);font-size:11px;letter-spacing:.06em;color:var(--navy)}
.zone-count .zn{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.zone-count .zc{font-family:var(--display);font-size:18px;color:var(--navy);line-height:1.1;margin-top:2px}
.shot-tot-grid{margin-top:4px}
.shot-draft{margin-top:12px}
.shot-out-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.chip-btn{
  border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;
  padding:10px 8px;font-weight:800;font-size:13.5px;font-family:inherit;
}
.chip-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.shot-draft-fields{display:grid;gap:10px}
.shot-draft-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn-text{background:none;border:0;color:var(--muted);font-weight:800;font-family:inherit;padding:8px 6px}
.btn-text.danger{color:#9b2c2c}
.entry-shot-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.entry-shot-row{display:flex;align-items:center;gap:8px;background:var(--mist);border-radius:12px;padding:6px 8px 6px 6px}
.entry-shot-row.on{outline:2px solid var(--gold)}
.entry-shot-row .shot-main{display:flex;align-items:center;gap:8px;flex:1;background:none;border:0;text-align:left;font-family:inherit;padding:2px;color:inherit;min-width:0}
.entry-shot-row .body{display:flex;flex-direction:column;min-width:0}
.entry-shot-row .body strong{font-size:13.5px;color:var(--navy)}
.entry-shot-row .body small{font-size:11.5px;color:var(--muted);font-weight:700}
.zone-pill{display:inline-grid;place-items:center;min-width:36px;height:36px;border-radius:9px;color:#fff;font-weight:800;font-size:12px;font-family:var(--display)}
.zone-pill.z1{background:#c44536}.zone-pill.z2{background:#e07a2f}.zone-pill.z3{background:#c49a08;color:#102048}
.zone-pill.z4{background:#2e6bb0}.zone-pill.z5{background:#2a5fa0}.zone-pill.z6{background:#3e6b52}
.shot-del{border:0;background:none;color:#9b2c2c;font-weight:800;font-size:12px;font-family:inherit;padding:6px 4px}
.veo-card .veo-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:0;font-family:inherit;text-align:left;cursor:pointer}
.veo-card .veo-toggle h3{margin:0}
.veo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.veo-checks{display:grid;gap:6px}
.veo-compare{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;align-items:center;background:var(--mist);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--navy)}
.veo-compare .k{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.veo-compare.mismatch{background:#fdecec;outline:1px solid #e8b4b4}
.veo-flags{background:#fdecec;border-radius:10px;padding:10px 12px;margin-top:10px;color:#9b2c2c;font-size:12.5px;font-weight:700}
.veo-flags p{margin:0 0 6px}.veo-flags p:last-child{margin:0}
.veo-flag-summary{margin:8px 0 0;font-size:12.5px}
@media (min-width:720px){
  .zone-count-grid{grid-template-columns:repeat(6,1fr)}
  .veo-grid{grid-template-columns:repeat(3,1fr)}
}

/* Team panel (Veo) + goal types */
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tool-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tool-btns .btn{width:100%;text-align:center}
.panel-launch-meta{font-size:12.5px;font-weight:700;color:var(--navy);margin:0 0 4px}
.panel-computed{margin-bottom:12px}
.panel-computed .sublbl{display:block;font-weight:700;font-size:10px;color:var(--muted);text-transform:none;letter-spacing:0;margin-top:2px}
.moment-card{margin-top:12px}
.moment-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:var(--navy);display:inline-block;border-radius:6px;padding:3px 8px;margin-bottom:6px}
.moment-card h3{margin:6px 0 8px}
.panel-fields{margin:8px 0}
.string-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.regain-types{display:grid;grid-template-columns:minmax(70px,0.9fr) 1fr 1fr 1fr;gap:6px 8px;align-items:center;margin-top:8px}
.regain-types .rh{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.regain-types .rl{font-size:11.5px;font-weight:800;color:var(--navy);line-height:1.2}
.regain-types .fld{margin:0}
.regain-types .fld span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.unit-vs-veo{background:var(--mist);border-radius:12px;padding:10px 12px;margin-top:8px}
.unit-vs-veo p{margin:0 0 6px;font-size:13px;color:var(--navy)}
.unit-vs-veo p:last-child{margin:0}
.check-row{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;font-weight:700;color:var(--navy);margin-top:8px}
.check-row input{margin-top:3px}
.veo-alongside{margin-top:12px}
.goal-split-list{margin:8px 0 0;padding:0 0 0 18px}
.goal-split-list li{margin:4px 0;font-size:13px;color:var(--navy)}
.goal-type-picks{display:grid;gap:8px;margin:10px 0 0;background:var(--mist);border-radius:12px;padding:10px}
.goal-type-picks button,.goal-type-inline button{
  border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;
  padding:10px 8px;font-weight:700;font-size:12.5px;font-family:inherit;text-align:left;
}
.goal-type-picks button.on,.goal-type-inline button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.goal-type-inline{display:grid;gap:6px;flex:1;margin:0 8px}
.shot-chip{flex-wrap:wrap}
.shot-chip.needs-type{outline:2px solid #c44536}
button.linkish{background:none;border:0;padding:0;color:var(--navy);font-weight:800;font-family:inherit;text-decoration:underline;cursor:pointer;font-size:inherit}
@media (min-width:720px){
  .string-grid{grid-template-columns:repeat(4,1fr)}
}

.panel-computed .grid-4{gap:6px}
.panel-computed .stat{padding:8px 6px}
.panel-computed .stat .num{font-size:26px}

</style>

function hasPos(pOrCode){
  const code = pOrCode && typeof pOrCode==="object" ? pOrCode.pos : pOrCode;
  return !!(code && POS[code]);
}
function posCode(p){ return hasPos(p) ? p.pos : ""; }
function posLabel(p){ return hasPos(p) ? (POS[p.pos].label || p.pos) : "Position not set"; }
function posShort(p){ return hasPos(p) ? POS[p.pos].short : "Not set"; }
function posAssignLabel(code){ return POS_ASSIGN_LABELS[code] || code || "Position not set"; }
function logPosOf(log, p){
  if(log && hasPos(log.pos)) return log.pos;
  if(p && hasPos(p)) return p.pos;
  return "";
}
function teamPosCounts(teamId){
  const roster = PLAYERS.filter(function(p){ return p.teamId===teamId; });
  let set=0;
  roster.forEach(function(p){ if(hasPos(p)) set++; });
  return { set:set, total:roster.length };
}

function simpleLog(matchId, minutes, avp, tgt, opts){
  opts = opts || {};
  return {
    matchId: matchId,
    minutes: minutes,
    dominant: opts.d||3,
    assertive: opts.a||3,
    connected: opts.c||4,
    reflection: opts.r || "Sample match log — fictional player.",
    veo: "",
    metrics: {
      avpCrePass: avp[0]||0,
      avpCreDribble: avp[1]||0,
      avpRecBetween: avp[2]||0,
      avpRecBehind: avp[3]||0,
      shots: opts.shots||[],
      tgt: tgt || {}
    }
  };
}
function sampleTgt(pos, hitAtt, hitDef){
  const t = {};
  if(pos==="GK"){ t.switches = hitAtt?6:3; t.claimedCrosses = hitDef?2:0; t.impactedCrosses = hitDef?1:1; }
  else if(pos==="FB"){ t.finalThird = hitAtt?6:2; t.blockedCrosses = hitDef?2:1; }
  else if(pos==="CB"){ t.midfieldDribbles = hitAtt?2:1; t.strikerClips = hitAtt?2:0; t.clearingHeaders = hitDef?3:1; }
  else if(pos==="6"){ t.weakSideBumps = hitAtt?3:1; t.oppHalfRegains = hitDef?3:1; }
  else if(pos==="8" || pos==="10"){ t.boxRuns = hitAtt?3:1; t.regains = hitDef?2:0; }
  else if(pos==="Winger"){ t.crossesCutbacks = hitAtt?3:1; t.shotsOnGoal = hitAtt?2:0; t.defenderIntercepts = hitDef?1:0; t.defenderBlockedPasses = hitDef?1:0; }
  else { t.shotsOnGoal = hitAtt?3:0; t.assists = hitAtt?2:1; t.blockedPasses = hitDef?2:1; t.intercepts = hitDef?1:0; }
  return t;
}
function sampleAvp(pos, strong){
  if(pos==="GK") return [0,0,0,0];
  if(pos==="CB") return strong ? [2,1,1,0] : [1,0,1,0];
  if(pos==="FB" || pos==="Winger") return strong ? [3,1,2,1] : [1,1,1,0];
  if(pos==="6" || pos==="8") return strong ? [4,2,3,1] : [2,1,1,0];
  if(pos==="10") return strong ? [5,2,4,1] : [2,1,2,0];
  return strong ? [2,1,3,1] : [1,0,1,0];
}
function addLogs(id, rows){
  SEED_LOGS[id] = (SEED_LOGS[id]||[]).concat(rows);
}
function posOf(id){
  const p = PLAYERS.find(function(x){ return x.id===id; });
  return p ? p.pos : "8";
}
function fillLogs(ids, mid, minutes, which){
  /* which: map id -> [hitAtt, hitDef, strongAvp] or true/false shorthand */
  ids.forEach(function(id){
    const flag = which[id];
    if(!flag) return;
    const hitA = flag===true ? true : flag[0];
    const hitD = flag===true ? true : flag[1];
    const strong = flag===true ? true : !!flag[2];
    const pos = posOf(id);
    addLogs(id, [simpleLog(mid, minutes, sampleAvp(pos, strong), sampleTgt(pos, hitA, hitD))]);
  });
}

const SHOT_ZONE_BOX = {
  Z1:{x:74,y:14,w:52,h:22},
  Z2:{x:74,y:44,w:52,h:22},
  Z3:{x:74,y:74,w:52,h:22},

function emptyVeoTotals(){
  return { attemptsUs:"", attemptsThem:"", goalsUs:"", goalsThem:"", poss:"", passes:"", passSucc:"", passAcc:"", duels:"" };
}
function emptyShotRecord(){
  return { us:[], against:[], veo: emptyVeoTotals() };
}
function shotPoint(zone, salt){
  const b = SHOT_ZONE_BOX[zone] || SHOT_ZONE_BOX.Z6;
  let n = 0;
  String(salt||zone).split("").forEach(function(c){ n = (n*33 + c.charCodeAt(0)) >>> 0; });
  const fx = ((n % 70) + 15) / 100;
  const fy = ((((n / 70) | 0) % 70) + 15) / 100;
  return { x: +(b.x + b.w * fx).toFixed(1), y: +(b.y + b.h * fy).toFixed(1) };
}
function seedShot(id, zone, outcome, minute, playerId, no){
  const pt = shotPoint(zone, id);
  const rec = { id:id, zone:zone, outcome:outcome, minute:minute, x:pt.x, y:pt.y };
  if(playerId) rec.playerId = playerId;
  if(no!=null && no!=="") rec.no = no;
  return rec;
}

function normalizeVeo(v){
  v = v || {};
  const out = emptyVeoTotals();
  Object.keys(out).forEach(function(k){
    out[k] = (v[k]===0 || v[k]) ? v[k] : "";
  });
  return out;
}
function normalizeEntryShot(s){
  if(!s || !s.zone) return null;
  const pt = (s.x!=null && s.y!=null) ? { x:+s.x, y:+s.y } : shotPoint(s.zone, s.id||s.zone);
  const rec = {
    id: s.id || ("sh-"+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36)),
    zone: s.zone,
    outcome: s.outcome || "Off target",
    minute: (s.minute===0 || s.minute) ? +s.minute : "",
    x: pt.x, y: pt.y
  };
  if(s.playerId) rec.playerId = s.playerId;
  if(s.no!=null && s.no!=="") rec.no = s.no;
  return rec;
}
function normalizeShotRecord(raw){
  const rec = emptyShotRecord();
  raw = raw || {};
  rec.us = (raw.us||[]).map(normalizeEntryShot).filter(Boolean);
  rec.against = (raw.against||[]).map(normalizeEntryShot).filter(Boolean);
  rec.veo = normalizeVeo(raw.veo);
  return rec;
}
function shotRecord(mid){
  if(!data.shots) data.shots = {};
  if(!data.shots[mid]) data.shots[mid] = emptyShotRecord();
  data.shots[mid] = normalizeShotRecord(data.shots[mid]);
  return data.shots[mid];
}
function matchShots(mid, side){
  const rec = shotRecord(mid);
  return (side==="against" ? rec.against : rec.us).slice();
}
function shotOnTarget(s){ return s && (s.outcome==="Goal" || s.outcome==="On target"); }
function shotInside(s){ return s && s.zone && s.zone!=="Z6"; }
function shotTotals(list){
  list = list || [];
  const byZone = { Z1:0,Z2:0,Z3:0,Z4:0,Z5:0,Z6:0 };
  let on=0, goals=0, inside=0, outside=0;
  list.forEach(function(s){
    if(byZone[s.zone]!=null) byZone[s.zone]++;
    if(shotOnTarget(s)) on++;
    if(s.outcome==="Goal") goals++;
    if(shotInside(s)) inside++; else outside++;
  });
  return { attempts:list.length, onTarget:on, goals:goals, inside:inside, outside:outside, byZone:byZone };
}
function entryXgSum(list){
  if(!xgCalibrated()) return null;
  let xg=0, n=0;
  (list||[]).forEach(function(s){
    const v = XG_CONVERSIONS[s.zone];
    if(v==null || !isFinite(+v)) return;
    xg += +v;
    n++;
  });
  return { xg:xg, n:n };
}
function veoNum(v){
  if(v===0) return 0;
  if(v==null || v==="") return null;
  const n = +v;
  return isFinite(n) ? n : null;
}
function veoMismatches(mid){
  const rec = shotRecord(mid);
  const us = shotTotals(rec.us);
  const ag = shotTotals(rec.against);
  const f = fixture(mid);
  const flags = [];
  const vu = veoNum(rec.veo.attemptsUs), vt = veoNum(rec.veo.attemptsThem);
  const gu = veoNum(rec.veo.goalsUs), gt = veoNum(rec.veo.goalsThem);
  if(vu!=null && vu!==us.attempts) flags.push("Veo reports "+vu+" of our attempts; "+us.attempts+" entered here.");
  if(vt!=null && vt!==ag.attempts) flags.push("Veo reports "+vt+" shots against; "+ag.attempts+" entered here.");
  if(gu!=null && gu!==us.goals) flags.push("Veo reports "+gu+" of our goals; "+us.goals+" entered here.");
  if(gt!=null && gt!==ag.goals) flags.push("Veo reports "+gt+" goals against; "+ag.goals+" entered here.");
  if(f && f.status==="played" && +f.shots!==us.attempts) flags.push("Fixture total is "+(+f.shots||0)+" of our attempts; "+us.attempts+" entered here.");
  if(f && f.status==="played" && +f.goals!==us.goals) flags.push("Fixture score has "+(+f.goals||0)+" of our goals; "+us.goals+" entered here.");
  return flags;
}

  if(s.playerId){

function startShotDraft(zone, existing){
  if(existing){
    ui.shotDraft = {
      id: existing.id,
      zone: existing.zone,
      outcome: existing.outcome,
      minute: existing.minute,
      playerId: existing.playerId||"",

    };

function saveShotDraft(){
  syncShotDraftFromDom();
  const d = ui.shotDraft;
  if(!d || !d.zone){ toast("Tap a zone first"); return; }
  if(!d.outcome){ toast("Mark the outcome"); return; }
  const mid = ui.shotMatch;
  const side = ui.shotSide==="against" ? "against" : "us";
  const rec = shotRecord(mid);
  const list = rec[side];
  let playerId = d.playerId || "";
  let no = d.no;
  if(side==="us" && playerId){
    const p = PLAYERS.find(function(x){ return x.id===playerId; });
    if(p) no = p.no;
  }
  if(d.id){
    const i = list.findIndex(function(s){ return s.id===d.id; });
    if(i>=0){
      const prev = list[i];
      const pt = (prev.zone===d.zone) ? { x:prev.x, y:prev.y } : shotPoint(d.zone, prev.id);
      list[i] = normalizeEntryShot({ id:prev.id, zone:d.zone, outcome:d.outcome, minute:d.minute, playerId:playerId, no:no, x:pt.x, y:pt.y });
    }
  }else{
    const id = nextShotId();
    const pt = shotPoint(d.zone, id);
    list.push(normalizeEntryShot({ id:id, zone:d.zone, outcome:d.outcome, minute:d.minute, playerId:playerId, no:no, x:pt.x, y:pt.y }));
  }
  rec[side] = list;
  data.shots[mid] = rec;
  saveData();
  ui.shotDraft = null;
  toast("Shot saved");
  render();
}

function deleteEntryShot(id){
  const mid = ui.shotMatch;
  if(!mid || !id) return;
  const rec = shotRecord(mid);
  rec.us = rec.us.filter(function(s){ return s.id!==id; });
  rec.against = rec.against.filter(function(s){ return s.id!==id; });
  data.shots[mid] = rec;
  saveData();
  if(ui.shotDraft && ui.shotDraft.id===id) ui.shotDraft = null;
  toast("Shot removed");
  render();
}

function saveVeoField(key, value){
  const mid = ui.shotMatch;
  if(!mid || !key) return;
  const rec = shotRecord(mid);
  rec.veo[key] = value==="" ? "" : (isFinite(+value) ? +value : value);
  data.shots[mid] = rec;
  saveData();
}

function handleShotEntryClick(t, ev){
  if(t.hasAttribute("data-entry-zone")){
    ev.preventDefault();
    if(ui.shotDraft) syncShotDraftFromDom();
    const zone = t.getAttribute("data-entry-zone");
    startShotDraft(zone, null);
    render();
    const box = document.getElementById("shot-draft");
    if(box) box.scrollIntoView({ block:"nearest" });
    return true;
  }
  const act = t.getAttribute("data-act");
  if(act==="open-shot-entry"){
    ev.preventDefault();
    ui.shotMatch = t.getAttribute("data-id");
    ui.shotSide = "us";
    ui.shotDraft = null;
    ui.veoOpen = false;
    ui.teamPanelMatch = null;
    ui.page = "summary";
    render(); window.scrollTo(0,0); return true;
  }
  if(act==="close-shot-entry"){
    ui.shotMatch = null; ui.shotDraft = null; render(); window.scrollTo(0,0); return true;
  }
  if(act==="shot-side"){
    if(ui.shotDraft) syncShotDraftFromDom();
    ui.shotSide = t.getAttribute("data-val")==="against" ? "against" : "us";
    ui.shotDraft = null;
    render(); return true;
  }
  if(act==="entry-outcome"){
    if(!ui.shotDraft) return true;
    ui.shotDraft.outcome = t.getAttribute("data-val");
    syncShotDraftFromDom();
    render(); return true;
  }
  if(act==="save-entry-shot"){ saveShotDraft(); return true; }
  if(act==="cancel-entry-shot"){ ui.shotDraft=null; render(); return true; }
  if(act==="edit-entry-shot"){
    const id = t.getAttribute("data-id");
    const rec = shotRecord(ui.shotMatch);
    let found = rec.us.find(function(s){ return s.id===id; });
    let side = "us";
    if(!found){ found = rec.against.find(function(s){ return s.id===id; }); side = "against"; }
    if(!found) return true;
    ui.shotSide = side;
    startShotDraft(found.zone, found);
    render();
    const box = document.getElementById("shot-draft");
    if(box) box.scrollIntoView({ block:"nearest" });
    return true;
  }
  if(act==="del-entry-shot"){
    deleteEntryShot(t.getAttribute("data-id"));
    return true;
  }
  if(act==="toggle-veo"){
    ui.veoOpen = !ui.veoOpen;
    render(); return true;
  }
  return false;
}

function handleShotEntryChange(ev){
  const t = ev.target;
  if(t.matches("input[data-act='veo-field'], input[data-act=\"veo-field\"]")){
    saveVeoField(t.getAttribute("data-key"), t.value);
    render();
    return true;
  }
  if(t.matches('select[name="entry-player"], input[name="entry-minute"], input[name="entry-no"]')){
    syncShotDraftFromDom();
    return true;
  }
  return false;
}



/* =============================================================================
   TEAM PANEL (VEO) + GOAL TYPES
   -----------------------------------------------------------------------------
   Coach-facing per-match entry from the Veo report, grouped under the four
   moments: Transition to defence (regains), Attacking organisation (shots +
   AVPs), Transition to attack (secured possessions), and Goals (type split).

   Secured possessions (4+) = pass strings of length 4, 5, 6, 7 and 8+.
   Total possessions = all strings of 2+ plus the coach's one-pass estimate.
   Secured possession rate = secured ÷ total.
   Passes in strings = 2·n2 + 3·n3 + 4·n4 + 5·n5 + 6·n6 + 7·n7 + 8·n8+.
   Shots per secured uses Shot entry "Our shots" when entered, otherwise Veo
   attempts. Team Task unit logging is unchanged; the Veo whole-team figure
   is shown alongside, and can optionally drive Shot Flow / attacking metrics.
   ============================================================================= */
const GOAL_TYPES = [
  { id:"secured", label:"Secured possession (4+ passes)" },
  { id:"counter", label:"4 to score (counter attack) \u2013 3 passes or fewer" }
];
const STRING_KEYS = ["s2","s3","s4","s5","s6","s7","s8"];
const STRING_LEN = { s2:2, s3:3, s4:4, s5:5, s6:6, s7:7, s8:8 };
const PANEL_FIELDS = STRING_KEYS.concat([
  "onePass","passSucc","passTot","fwdSucc","fwdTot",
  "regains","regainsOpp","regainsFinal",
  "tTot","tOpp","tFinal","iTot","iOpp","iFinal","lbrTot","lbrOpp","lbrFinal",
  "duels","attempts","insideBox"
]);

function emptyTeamPanel(){
  const o = { useVeoSecured:false };
  PANEL_FIELDS.forEach(function(k){ o[k] = ""; });
  return o;
}
function panelNum(v){
  if(v===0) return 0;
  if(v==null || v==="") return null;
  const n = +v;
  return isFinite(n) ? n : null;
}
function panelInt(v){ const n = panelNum(v); return n==null ? 0 : n; }
function normalizeTeamPanel(raw){
  const o = emptyTeamPanel();
  raw = raw || {};
  PANEL_FIELDS.forEach(function(k){ o[k] = (raw[k]===0 || raw[k]) ? raw[k] : ""; });
  o.useVeoSecured = !!raw.useVeoSecured;
  return o;
}
function teamPanel(mid){
  if(!data.teamPanel) data.teamPanel = {};
  data.teamPanel[mid] = normalizeTeamPanel(data.teamPanel[mid]);
  return data.teamPanel[mid];
}
function panelHasVeo(p){
  if(!p) return false;
  return STRING_KEYS.some(function(k){ return panelNum(p[k])!=null; }) || panelNum(p.onePass)!=null || panelNum(p.regains)!=null;
}
function fmtPctWhole(n){
  if(n==null || !isFinite(n)) return "\u2014";
  return Math.round(n)+"%";
}
function fmtRate2(n){
  if(n==null || !isFinite(n)) return "\u2014";
  return (Math.round(n*100)/100).toFixed(2).replace(/\.?0+$/,"") === String(Math.round(n)) ? String(Math.round(n)) : (Math.round(n*100)/100).toFixed(2).replace(/0$/,"");
}
function formatShotPerSec(n){
  if(n==null || !isFinite(n)) return "\u2014";
  return (Math.round(n*100)/100).toFixed(2);
}

function matchShotAttemptSource(mid){
  const entered = matchShots(mid, "us");
  if(entered && entered.length){
    const tot = shotTotals(entered);
    return { attempts:tot.attempts, inside:tot.inside, source:"entry" };
  }
  const rec = (data.shots && data.shots[mid]) ? normalizeShotRecord(data.shots[mid]) : null;
  const veoAtt = rec ? veoNum(rec.veo.attemptsUs) : null;
  const p = teamPanel(mid);
  const panelAtt = panelNum(p.attempts);
  const panelIn = panelNum(p.insideBox);
  const attempts = veoAtt!=null ? veoAtt : (panelAtt!=null ? panelAtt : null);
  const f = fixture(mid);
  return {
    attempts: attempts!=null ? attempts : (f && f.status==="played" ? +f.shots||0 : 0),
    inside: panelIn,
    source: veoAtt!=null ? "veo" : (panelAtt!=null ? "panel" : "fixture")
  };
}

function computeTeamPanel(mid){
  const p = teamPanel(mid);
  const n2=panelInt(p.s2), n3=panelInt(p.s3), n4=panelInt(p.s4), n5=panelInt(p.s5), n6=panelInt(p.s6), n7=panelInt(p.s7), n8=panelInt(p.s8);
  const one = panelInt(p.onePass);
  const strings2plus = n2+n3+n4+n5+n6+n7+n8;
  const secured = n4+n5+n6+n7+n8;
  const totalPoss = strings2plus + one;
  const rate = totalPoss ? (secured / totalPoss * 100) : null;
  const passesInStrings = n2*2 + n3*3 + n4*4 + n5*5 + n6*6 + n7*7 + n8*8;
  const shotSrc = matchShotAttemptSource(mid);
  const shots = shotSrc.attempts;
  const shotsPerSecured = secured ? (shots / secured) : null;
  const insideShare = (shotSrc.inside!=null && shots) ? (shotSrc.inside / shots * 100) : (shotSrc.inside!=null && shots===0 ? 0 : null);
  const passSucc = panelNum(p.passSucc), passTot = panelNum(p.passTot);
  const passPct = (passTot && passTot>0 && passSucc!=null) ? (passSucc / passTot * 100) : null;
  const fwdSucc = panelNum(p.fwdSucc), fwdTot = panelNum(p.fwdTot);
  const fwdPct = (fwdTot && fwdTot>0 && fwdSucc!=null) ? (fwdSucc / fwdTot * 100) : null;
  const tSum = panelInt(p.tTot)+panelInt(p.iTot)+panelInt(p.lbrTot);
  const tOpp = panelInt(p.tOpp)+panelInt(p.iOpp)+panelInt(p.lbrOpp);
  const tFin = panelInt(p.tFinal)+panelInt(p.iFinal)+panelInt(p.lbrFinal);
  const typesUsed = ["tTot","iTot","lbrTot","tOpp","iOpp","lbrOpp","tFinal","iFinal","lbrFinal"].some(function(k){ return panelNum(p[k])!=null; });
  const regains = panelNum(p.regains)!=null ? panelInt(p.regains) : (typesUsed ? tSum : 0);
  const regainsOpp = panelNum(p.regainsOpp)!=null ? panelInt(p.regainsOpp) : (typesUsed ? tOpp : 0);
  const regainsFinal = panelNum(p.regainsFinal)!=null ? panelInt(p.regainsFinal) : (typesUsed ? tFin : 0);
  const oppPct = regains ? (regainsOpp / regains * 100) : null;
  const typeMismatch = typesUsed && panelNum(p.regains)!=null && (tSum!==panelInt(p.regains) || tOpp!==panelInt(p.regainsOpp) || tFin!==panelInt(p.regainsFinal));
  return {
    mid:mid, n2:n2, n3:n3, n4:n4, n5:n5, n6:n6, n7:n7, n8:n8, one:one,
    secured:secured, totalPoss:totalPoss, rate:rate, passesInStrings:passesInStrings,
    shots:shots, shotSource:shotSrc.source, inside:shotSrc.inside, shotsPerSecured:shotsPerSecured, insideShare:insideShare,
    passSucc:passSucc, passTot:passTot, passPct:passPct, fwdSucc:fwdSucc, fwdTot:fwdTot, fwdPct:fwdPct,
    regains:regains, regainsOpp:regainsOpp, regainsFinal:regainsFinal, oppPct:oppPct,
    tTot:panelInt(p.tTot), tOpp:panelInt(p.tOpp), tFinal:panelInt(p.tFinal),
    iTot:panelInt(p.iTot), iOpp:panelInt(p.iOpp), iFinal:panelInt(p.iFinal),
    lbrTot:panelInt(p.lbrTot), lbrOpp:panelInt(p.lbrOpp), lbrFinal:panelInt(p.lbrFinal),
    duels:panelNum(p.duels), typesUsed:typesUsed, typeMismatch:typeMismatch,
    useVeoSecured: !!p.useVeoSecured, hasVeo: panelHasVeo(p)
  };
}

function veoSecuredOf(mid){
  const c = computeTeamPanel(mid);
  return c.hasVeo ? c.secured : null;
}
function effectiveSecured(mid){
  const p = teamPanel(mid);
  const veo = veoSecuredOf(mid);
  if(p.useVeoSecured && veo!=null) return veo;
  return possTotals(mid).secured||0;
}

function goalTypeLabel(id){
  const t = GOAL_TYPES.find(function(x){ return x.id===id; });
  return t ? t.label : "";
}
function playerGoalShots(pid, mid){
  const l = mid ? logFor(pid, mid) : null;
  const logs = mid ? (l ? [l] : []) : logsOf(pid);
  const out = [];
  logs.forEach(function(log){
    ((log.metrics && log.metrics.shots) || []).forEach(function(s){
      if(s && s.outcome==="Goal") out.push({ playerId:pid, matchId:log.matchId, shot:s });
    });
  });
  return out;
}
function teamGoalSplit(teamId, mid){
  const roster = playersOf(teamId);
  let secured=0, counter=0, unset=0, list=[];
  roster.forEach(function(p){
    playerGoalShots(p.id, mid).forEach(function(row){
      const t = row.shot.goalType;
      if(t==="secured") secured++;
      else if(t==="counter") counter++;
      else unset++;
      list.push({ player:p, matchId:row.matchId, zone:row.shot.zone, goalType:t||"" });
    });
  });
  return { secured:secured, counter:counter, unset:unset, total:secured+counter+unset, list:list };
}
function seasonGoalSplit(teamId){
  const matches = playedFixtures(teamId);
  let secured=0, counter=0, unset=0;
  const per = matches.map(function(f){
    const s = teamGoalSplit(teamId, f.id);
    secured += s.secured; counter += s.counter; unset += s.unset;
    return { id:f.id, opp:f.opp, date:f.date, result:f.result, split:s };
  });
  return { secured:secured, counter:counter, unset:unset, total:secured+counter+unset, matches:per };
}

function renderGoalSplitCard(split, opts){
  opts = opts||{};
  if(!split.total && !opts.always) return '<p class="hint">'+(opts.empty||"No player-logged goals yet. When a player ticks a goal type on her match log, the split appears here.")+"</p>";
  return '<div class="goal-split">' +
    '<div class="grid-3">' +
      '<div class="stat gold"><div class="num">'+split.secured+'</div><div class="lbl">Secured possession (4+)</div></div>' +
      '<div class="stat navy"><div class="num">'+split.counter+'</div><div class="lbl">4 to score (counter)</div></div>' +
      '<div class="stat"><div class="num">'+split.total+'</div><div class="lbl">Player-logged goals</div></div>' +
    "</div>" +
    (split.unset ? '<p class="hint">'+split.unset+" goal"+(split.unset===1?"":"s")+" still need a type ticked.</p>" : "") +
    (split.list && split.list.length ? '<ul class="goal-split-list">'+split.list.map(function(g){
      return "<li><strong>"+esc(fullName(g.player))+"</strong> \u00b7 "+esc(g.zone)+" \u00b7 "+(g.goalType?esc(goalTypeLabel(g.goalType)):"Type not set")+"</li>";
    }).join("")+"</ul>" : "") +
  "</div>";
}

function renderSeasonGoalSplit(teamId){
  const s = seasonGoalSplit(teamId);
  return '<div class="card" style="margin-bottom:12px"><div class="card-head"><h3>Season goal types</h3><span class="badge-muted badge">From player match logs</span></div>' +
    '<p class="hint">Each scorer ticks whether the goal came from a secured possession (4+ passes) or a 4 to score counter (3 passes or fewer).</p>' +
    renderGoalSplitCard(s, { always:true, empty:"No goals typed yet this season." }) +
  "</div>";
}

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function buildSeed(){
  const idp = {};
  PLAYERS.forEach(p => { idp[p.id] = deepClone(SEED_IDP[p.id] || genericIdp(p)); });
  const logs = {};
  PLAYERS.forEach(p => { logs[p.id] = deepClone(SEED_LOGS[p.id] || []); });
  return { idp, logs, possessions: deepClone(SEED_POSSESSIONS), fixtures: deepClone(FIXTURES), positions: deepClone(SEED_POSITIONS), shots: deepClone(SEED_SHOTS), teamPanel: deepClone(SEED_TEAM_PANEL) };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE);
    if(!raw) return buildSeed();
    const d = JSON.parse(raw);
    const seed = buildSeed();
    return {
      idp: Object.assign(seed.idp, d.idp||{}),
      logs: Object.assign(seed.logs, d.logs||{}),
      possessions: Object.assign(seed.possessions, d.possessions||{}),
      fixtures: d.fixtures && d.fixtures.length ? d.fixtures : seed.fixtures,
      positions: Object.assign(deepClone(seed.positions), d.positions||{}),
      shots: Object.assign(deepClone(seed.shots), d.shots||{}),
      teamPanel: Object.assign(deepClone(seed.teamPanel), d.teamPanel||{})
    };
  }catch(e){ return buildSeed(); }
}
function saveData(){ try{ localStorage.setItem(STORAGE, JSON.stringify(data)); }catch(e){} }

function applyPositions(){
  const map = (data && data.positions) || {};
  PLAYERS.forEach(function(p){
    const a = map[p.id] || {};
    p.pos = a.pos || "";
    p.pos2 = a.pos2 || "";
    p.unit = p.pos ? unitForPos(p.pos) : "";
  });
}

function fullName(p){ return p.first+" "+p.last; }
function initials(p){ return (p.first[0]+p.last[0]).toUpperCase(); }
function fixture(id){ return data.fixtures.find(f => f.id===id); }
function playedFixtures(){ return data.fixtures.filter(f => f.status==="played"); }
function upcomingFixtures(){ return data.fixtures.filter(f => f.status==="upcoming"); }
function fmtDate(iso){
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString("en-US",{ month:"short", day:"numeric", year:"numeric" });
}
function fmtDateShort(iso){
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString("en-US",{ month:"short", day:"numeric" });
}
function avg(nums){ return nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : 0; }
function idpHasTarget(g){
  return !!(g && String(g.target||"").trim());
}
function idpIsSet(pid){
  return (data.idp[pid]||[]).some(idpHasTarget);
}
function idpAvg(pid){
  const g = (data.idp[pid]||[]).filter(idpHasTarget);
  if(!g.length) return null;
  return Math.round(avg(g.map(function(x){ return +x.progress||0; })));
}
function logsOf(pid){ return data.logs[pid]||[]; }
function logFor(pid, mid){ return logsOf(pid).find(l => l.matchId===mid); }
function identityAvg(pid){
  const ls = logsOf(pid);
  if(!ls.length) return { d:0,a:0,c:0, n:0 };
  return { d: avg(ls.map(l=>l.dominant)), a: avg(ls.map(l=>l.assertive)), c: avg(ls.map(l=>l.connected)), n: ls.length };
}
function possTotals(mid){
  const p = data.possessions[mid];
  if(!p) return { secured:0, unsecured:0, total:0, security:0 };
  const secured = (p.def?.secured||0)+(p.mid?.secured||0)+(p.att?.secured||0);
  const unsecured = (p.def?.unsecured||0)+(p.mid?.unsecured||0)+(p.att?.unsecured||0);
  const total = secured+unsecured;
  return { secured, unsecured, total, security: total? (secured/total*100):0 };
}
function shotFlow(mid){
  const f = fixture(mid);
  const mins = f?.minutes||0, attempts = f?.shots||0;
  if(!mins) return 0;
  return effectiveSecured(mid) * attempts / mins;
}
function toast(msg){
  ui.toast = msg;
  render();
  setTimeout(function(){ if(ui.toast===msg){ ui.toast=null; render(); } }, 2200);
}

function readDraftFromForm(root){
  const d = ui.draft || {};
  function get(name){
    const el = root.querySelector('[name="'+name+'"]');
    return el ? el.value : d[name];
  }
  d.matchId = get("matchId") || d.matchId;
  d.minutes = +get("minutes")||0;
  d.reflection = get("reflection") ?? d.reflection;
  d.veo = get("veo") ?? d.veo;
  d.tgtAttNote = get("tgtAttNote") ?? d.tgtAttNote;
  d.tgtDefNote = get("tgtDefNote") ?? d.tgtDefNote;
  root.querySelectorAll(".stepper input").forEach(function(inp){ d[inp.name] = +inp.value||0; });
  return d;
}

function draftToMetrics(form, d){
  const base = emptyMetrics(form);
  if(form==="gk"){
    return { conceded:+d.conceded||0, saves: d.saves || base.saves, shortSucc:+d.shortSucc||0, shortAtt:+d.shortAtt||0, longSucc:+d.longSucc||0, longAtt:+d.longAtt||0, claims:+d.claims||0, crossesFaced:+d.crossesFaced||0, punches:+d.punches||0 };
  }
  if(form==="defender"){
    return { progComp:+d.progComp||0, progAtt:+d.progAtt||0, avpRecBetween:+d.avpRecBetween||0, avpRecBehind:+d.avpRecBehind||0, avpCrePass:+d.avpCrePass||0, avpCreDribble:+d.avpCreDribble||0, recoveries:+d.recoveries||0, defActions:+d.defActions||0 };
  }
  if(form==="mid"){
    return { securedContrib:+d.securedContrib||0, lineBreakComp:+d.lineBreakComp||0, lineBreakAtt:+d.lineBreakAtt||0, avpCrePass:+d.avpCrePass||0 };
  }
  return { avpCrePass:+d.avpCrePass||0, avpCreDribble:+d.avpCreDribble||0, avpRecBetween:+d.avpRecBetween||0, avpRecBehind:+d.avpRecBehind||0, shots: d.shots||[] };
}

function openLog(matchId){
  const p = player();
  const form = POS[p.pos].form;
  const existing = matchId ? logFor(p.id, matchId) : null;
  const fx = matchId ? fixture(matchId) : null;
  const m = existing ? deepClone(existing.metrics) : emptyMetrics(form);
  ui.logMode = matchId || "new";
  ui.draft = Object.assign({
    matchId: matchId || "",
    minutes: existing ? existing.minutes : (fx? fx.minutes : 70),
    dominant: existing ? existing.dominant : 0,
    assertive: existing ? existing.assertive : 0,
    connected: existing ? existing.connected : 0,
    reflection: existing ? existing.reflection : "",
    veo: existing ? existing.veo : "",
    saves: m.saves,
    shots: m.shots ? deepClone(m.shots) : [],
    _zone: null,
    _outcome: null,
    _goalType: null
  }, m);
  render();
}

function syncDraftFromDom(){
  const root = document.getElementById("log-form");
  if(!root || !ui.draft) return;
  const d = readDraftFromForm(root);
  d.saves = ui.draft.saves;
  d.shots = ui.draft.shots;
  d.dominant = ui.draft.dominant;
  d.assertive = ui.draft.assertive;
  d.connected = ui.draft.connected;
  d._zone = ui.draft._zone;
  d._outcome = ui.draft._outcome;
  ui.draft = d;
}

function metricsSummary(form, m){
  if(!m) return "No data";
  if(form==="gk"){
    const saves = Object.values(m.saves||{}).reduce(function(a,b){ return a+b; },0);
    return saves+" saves · "+m.conceded+" conceded · short "+m.shortSucc+"/"+m.shortAtt+" · claims "+m.claims+"/"+m.crossesFaced;
  }
  if(form==="defender"){
    return "Prog. passes "+m.progComp+"/"+m.progAtt+" · rec. "+m.recoveries+" · def. actions "+m.defActions+" · AVP C-P "+m.avpCrePass;
  }
  if(form==="mid"){
    return "Secured contrib. "+m.securedContrib+" · line-breaks "+m.lineBreakComp+"/"+m.lineBreakAtt+" · Created–Pass "+m.avpCrePass;
  }
  const sh = (m.shots||[]).length;
  const g = (m.shots||[]).filter(function(s){ return s.outcome==="Goal"; }).length;
  return "AVP C-P "+m.avpCrePass+" · C-D "+m.avpCreDribble+" · R-Bet "+m.avpRecBetween+" · R-Bhd "+m.avpRecBehind+" · "+sh+" shot"+(sh===1?"":"s")+(g? " · "+g+" goal"+(g===1?"":"s"):"");
}
